parate dropdowns used to ask this — Channels and Assets Needed — with the same eight names in both and no way to see what you had picked.<\u002Fdiv>\n                      <\u002Fsc-if>\n                      <div style=\"font-size:11.5px;color:#88887e;margin-bottom:14px;line-height:1.5\">One row per place a customer might see this. Promoting is not the same as needing artwork made.<\u002Fdiv>\n                      <div style=\"border:1px solid #e4e4de;border-radius:9px;overflow:hidden\">\n                        <div style=\"display:grid;grid-template-columns:minmax(110px,1fr) 62px 62px;background:#fbfbf9;border-bottom:1px solid #e4e4de;padding:8px 12px\">\n                          <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">Where<\u002Fdiv>\n                          <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;text-align:center\">Promote<\u002Fdiv>\n                          <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;text-align:center\">Artwork<\u002Fdiv>\n                        <\u002Fdiv>\n                        <sc-for list=\"{{ subMatrix }}\" as=\"r\" hint-placeholder-count=\"8\">\n                          <div style=\"{{ r.rowCss }}\">\n                            <div style=\"min-width:0;padding-right:10px\">\n                              <div style=\"font-size:12.5px;font-weight:600\">{{ r.name }}<\u002Fdiv>\n                              <div style=\"font-size:10.5px;color:#88887e;margin-top:2px;line-height:1.4\">{{ r.note }}<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div style=\"display:flex;justify-content:center;align-items:flex-start\">\n                              <button sc-camel-on-click=\"{{ r.togglePromote }}\" style=\"{{ r.promoteCss }}\">{{ r.promoteTick }}<\u002Fbutton>\n                            <\u002Fdiv>\n                            <div style=\"display:flex;justify-content:center;align-items:flex-start\">\n                              <sc-if value=\"{{ r.canArt }}\" hint-placeholder-val=\"{{ true }}\">\n                                <button sc-camel-on-click=\"{{ r.toggleArt }}\" style=\"{{ r.artCss }}\">{{ r.artTick }}<\u002Fbutton>\n                              <\u002Fsc-if>\n                              <sc-if value=\"{{ r.noArt }}\" hint-placeholder-val=\"{{ false }}\">\n                                <span style=\"font-size:11px;color:#c0c0b8\">n/a<\u002Fspan>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <div style=\"margin-top:12px\">\n                        <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:4px\">\n                          <span style=\"font-size:11px;font-weight:600;color:#44443e\">Anywhere else<\u002Fspan>\n                          <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">ChannelOther<\u002Fspan>\n                        <\u002Fdiv>\n                        <input type=\"text\" value=\"{{ subOther }}\" sc-camel-on-change=\"{{ subSetOther }}\" placeholder=\"Somewhere this list does not cover\" style=\"{{ subInputCss }}\">\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"margin-top:14px;padding:12px 14px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:9px\">\n                        <div style=\"font-size:11.5px;font-weight:700;margin-bottom:4px\">The design brief is not this step<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:#44443e;line-height:1.55\">Ticking Artwork raises a design job. The brief that job needs — copy, dimensions, tone, reference — is written after the activity is accepted, by whoever owns it. A designer is not notified until the brief is complete, so an empty brief holds the job rather than landing on their queue as guesswork.<\u002Fdiv>\n                      <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ subIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:17px 20px\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:10px\">What you have told us<\u002Fdiv>\n                      <sc-for list=\"{{ subReview }}\" as=\"r\" hint-placeholder-count=\"8\">\n                        <div style=\"display:flex;gap:14px;padding:8px 0;border-bottom:1px solid #f2f2ef;font-size:12.5px;align-items:baseline\">\n                          <div style=\"width:150px;flex-shrink:0;color:#88887e;font-size:11.5px\">{{ r.k }}<\u002Fdiv>\n                          <div style=\"flex:1;min-width:0;font-weight:500;line-height:1.45\">{{ r.v }}<\u002Fdiv>\n                          <button sc-camel-on-click=\"{{ r.edit }}\" style=\"font-size:10.5px;color:#0a6640;font-weight:600;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;flex-shrink:0\">Edit<\u002Fbutton>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                      <div style=\"margin-top:16px;padding:13px 15px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:9px\">\n                        <div style=\"font-size:11.5px;font-weight:700;margin-bottom:5px\">What happens when you submit<\u002Fdiv>\n                        <div style=\"font-size:11.5px;color:#44443e;line-height:1.6\">The activity is created at <span style=\"font-family:'DM Mono',monospace;font-size:11px\">WorkflowStage = Intake<\u002Fspan> and appears in Submissions. Marketing checks the dates and mechanics, confirms the jobs listed here, assigns an owner to each, and only then does the activity move to Planning. Nothing is built until someone has accepted it.<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <div style=\"padding:13px 20px;border-top:1px solid #e4e4de;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fbfbf9\">\n                    <sc-if value=\"{{ subCanBack }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button sc-camel-on-click=\"{{ subBack }}\" style=\"padding:8px 15px;border:1px solid #e4e4de;background:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;color:#44443e\" style-hover=\"background:#f2f2ef\">Back<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <div style=\"flex:1\"><\u002Fdiv>\n                    <sc-if value=\"{{ subIs4 }}\" hint-placeholder-val=\"{{ false }}\">\n                      <button style=\"{{ subSubmitCss }}\">Submit for review<\u002Fbutton>\n                    <\u002Fsc-if>\n                    <sc-if value=\"{{ subCanNext }}\" hint-placeholder-val=\"{{ true }}\">\n                      <button sc-camel-on-click=\"{{ subNext }}\" style=\"padding:8px 17px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer\">Continue<\u002Fbutton>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 250px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                  <div style=\"padding:11px 14px;border-bottom:1px solid #e4e4de\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px\">\n                      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#0a6640\">This will create<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">{{ subJobCount }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e;margin-top:3px;line-height:1.45\">Marketing confirms and assigns these. You are not committing anyone yet.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"padding:11px 14px;display:flex;flex-direction:column;gap:7px\">\n                    <sc-for list=\"{{ subJobs }}\" as=\"j\" hint-placeholder-count=\"3\">\n                      <div style=\"background:#fbfbf9;border:1px solid #e4e4de;border-radius:8px;padding:9px 10px\">\n                        <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:3px\">\n                          <div style=\"{{ j.dot }}\"><\u002Fdiv>\n                          <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#88887e\">{{ j.type }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:12px;font-weight:600;line-height:1.3\">{{ j.title }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e;margin-top:2px;line-height:1.4\">{{ j.detail }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ subNoJobs }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"padding:16px 4px;font-size:11.5px;color:#88887e;line-height:1.5;text-align:center\">Nothing yet. Step three is where you say what you need made.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-if value=\"{{ subHasJobs }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                    <div style=\"padding:11px 14px;border-bottom:1px solid #e4e4de\">\n                      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#0a6640\">Folder that gets created<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#88887e;margin-top:3px;line-height:1.45\">Created once, when the activity is accepted. Only the subfolders your answers need.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:11px 14px\">\n                      <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e;line-height:1.6;word-break:break-word;padding-bottom:9px;border-bottom:1px solid #f2f2ef;margin-bottom:8px\">{{ subFolderPath }}<\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:2px\">\n                        <sc-for list=\"{{ subFolders }}\" as=\"d\" hint-placeholder-count=\"4\">\n                          <div style=\"display:flex;align-items:center;gap:7px;font-size:11.5px;color:#44443e\">\n                            <span style=\"opacity:.4\">▸<\u002Fspan>\n                            <span style=\"flex:1;min-width:0\">{{ d.name }}<\u002Fspan>\n                            <span style=\"font-size:9.5px;color:#a8a89e\">{{ d.why }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ subHasBlockers }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#fff;border:1px solid #e8b0a4;border-radius:11px;overflow:hidden\">\n                    <div style=\"padding:10px 14px;border-bottom:1px solid #f5ded8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a8321f\">Needed to submit<\u002Fdiv>\n                    <div style=\"padding:4px 0\">\n                      <sc-for list=\"{{ subBlockers }}\" as=\"b\" hint-placeholder-count=\"2\">\n                        <div style=\"{{ b.css }}\">{{ b.t }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <sc-if value=\"{{ subHasLater }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                    <div style=\"padding:10px 14px;border-bottom:1px solid #f2f2ef\">\n                      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e\">Can wait, but is not forgotten<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#88887e;margin-top:3px;line-height:1.45\">Each one is held against the activity and asked for at the point it blocks something.<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"padding:2px 0\">\n                      <sc-for list=\"{{ subLater }}\" as=\"l\" hint-placeholder-count=\"3\">\n                        <div style=\"padding:9px 14px;border-bottom:1px solid #f7f7f5\">\n                          <div style=\"font-size:11.5px;color:#44443e;line-height:1.5\">{{ l.t }}<\u002Fdiv>\n                          <div style=\"font-size:10px;color:#0a6640;font-weight:600;margin-top:3px\">{{ l.who }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isTicket }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1180px\">\n            <button sc-camel-on-click=\"{{ goWork }}\" style=\"font-size:11.5px;color:#0a6640;font-weight:600;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;margin-bottom:12px\">← Back to work register<\u002Fbutton>\n\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n              <div style=\"padding:17px 20px;border-bottom:1px solid #e4e4de\">\n                <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n                  <div style=\"min-width:0;flex:1 1 320px\">\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap\">\n                      <span style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">JOB-241<\u002Fspan>\n                      <span style=\"{{ ticketTypePill }}\">Design Asset<\u002Fspan>\n                      <div style=\"width:1px;height:12px;background:#e4e4de\"><\u002Fdiv>\n                      <div style=\"{{ tkVenueDot }}\"><\u002Fdiv>\n                      <span style=\"font-size:11px;color:#88887e\">Mustang Bar<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;line-height:1.15\">Grand Final poster pack<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap\">\n                      <span style=\"font-size:11.5px;color:#88887e\">Part of<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ goDetail }}\" style=\"display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid #c8e5d6;background:#e8f5ee;border-radius:20px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:#0a6640;cursor:pointer\" style-hover=\"background:#d6ecdf\">Grand Final Day →<\u002Fbutton>\n                      <span style=\"font-size:10.5px;color:#a8a89e\">1 of 5 jobs<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:7px;align-items:flex-end\">\n                    <div style=\"display:flex;align-items:center;gap:8px\">\n                      <div style=\"{{ tkOwnerAv }}\">LB<\u002Fdiv>\n                      <div style=\"text-align:right\">\n                        <div style=\"font-size:12px;font-weight:600\">Luca Bianchi<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e\">Design<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e\">Round {{ tkRound }} · {{ tkSaveStamp }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:14px;align-items:center\">\n                  <sc-for list=\"{{ tkStages }}\" as=\"st\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ st.css }}\">{{ st.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"padding:13px 20px;border-bottom:1px solid #e4e4de;background:#fbfbf9\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:9px\">\n                  <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">Running alongside this<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#88887e\">All five came from one approval. None waits on design.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:8px\">\n                  <sc-for list=\"{{ tkSiblings }}\" as=\"s\" hint-placeholder-count=\"5\">\n                    <div style=\"{{ s.css }}\">\n                      <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:5px\">\n                        <div style=\"{{ s.typeDot }}\"><\u002Fdiv>\n                        <span style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#88887e\">{{ s.type }}<\u002Fspan>\n                        <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0;margin-left:auto\">{{ s.id }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"{{ s.titleCss }}\">{{ s.title }}<\u002Fdiv>\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:7px\">\n                        <span style=\"{{ s.pillCss }}\">{{ s.stage }}<\u002Fspan>\n                        <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#88887e;white-space:nowrap\">{{ s.due }}<\u002Fspan>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#44443e;margin-top:9px;line-height:1.55;max-width:760px;text-wrap:pretty\">Each job carries its own rounds, approvals and due date. The activity moves to Live when all five close, so a slow POS update holds the activity without touching the design job's status. Only the ticket setup has a real dependency: it needs the confirmed capacity, not the artwork.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-wrap:wrap\">\n                <div style=\"flex:1 1 420px;min-width:0;border-right:1px solid #e4e4de\">\n                  <div style=\"padding:13px 20px 4px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap\">\n                    <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">The brief<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#a8a89e\">Every field saves on its own<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ tkGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n                    <div style=\"padding:10px 20px 4px\">\n                      <div style=\"font-size:11.5px;font-weight:700;color:#0a6640;padding-bottom:5px;border-bottom:1px solid #e8f5ee;margin-bottom:6px\">{{ g.name }}<\u002Fdiv>\n                      <sc-for list=\"{{ g.fields }}\" as=\"f\" hint-placeholder-count=\"3\">\n                        <div style=\"padding:7px 0\">\n                          <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:4px\">\n                            <span style=\"font-size:10.5px;font-weight:600;color:#44443e\">{{ f.label }}<\u002Fspan>\n                            <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">{{ f.col }}<\u002Fspan>\n                            <span style=\"{{ f.chipCss }}\">{{ f.chip }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                            <textarea value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" rows=\"3\" style=\"{{ f.inputCss }}\"><\u002Ftextarea>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.isDate }}\" hint-placeholder-val=\"{{ false }}\">\n                            <input type=\"date\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"{{ f.inputCss }}\">\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                            <input type=\"text\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" style=\"{{ f.inputCss }}\">\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n\n                  <div style=\"padding:10px 20px 18px\">\n                    <div style=\"font-size:11.5px;font-weight:700;color:#0a6640;padding-bottom:5px;border-bottom:1px solid #e8f5ee;margin-bottom:8px\">Placements<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:7px\">\n                      <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">Platform<\u002Fspan>\n                      <span style=\"{{ platChipCss }}\">{{ platChip }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                      <sc-for list=\"{{ tkPlats }}\" as=\"p\" hint-placeholder-count=\"9\">\n                        <button sc-camel-on-click=\"{{ p.toggle }}\" style=\"{{ p.css }}\">{{ p.name }}<\u002Fbutton>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"font-size:10.5px;color:#88887e;margin-top:8px;line-height:1.5\">Placements were being joined into <span style=\"font-family:'DM Mono',monospace;font-size:10px\">AssetSpec<\u002Fspan> with a pipe character. They belong in their own multi-choice column so a web job can be raised from a Website placement.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"flex:1 1 330px;min-width:0;background:#fbfbf9;border-top:1px solid #e4e4de\">\n                  <div style=\"padding:15px 18px;border-bottom:1px solid #e4e4de\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">Files<\u002Fdiv>\n                      <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">JobFolderURL<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:11px 12px;margin-bottom:8px\">\n                      <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e;line-height:1.6;word-break:break-word;margin-bottom:8px\">Marketing / Activities / 2026 / <span style=\"color:#0f0f0d\">Mustang Bar<\u002Fspan> / 2026-09-26 Grand Final Day [1042]<\u002Fdiv>\n                      <a href=\"#\" style=\"display:flex;align-items:center;justify-content:center;gap:6px;padding:7px;background:#0f120f;color:#fff;border-radius:7px;font-size:11.5px;font-weight:700;text-decoration:none\">Open in SharePoint →<\u002Fa>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:3px;margin-bottom:9px\">\n                      <sc-for list=\"{{ tkFolders }}\" as=\"d\" hint-placeholder-count=\"6\">\n                        <a href=\"#\" style=\"{{ d.css }}\">\n                          <span style=\"opacity:.5;flex-shrink:0\">▸<\u002Fspan>\n                          <span style=\"flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ d.name }}<\u002Fspan>\n                          <sc-if value=\"{{ d.mine }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#0a6640;flex-shrink:0\">This job<\u002Fspan>\n                          <\u002Fsc-if>\n                          <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#a8a89e;flex-shrink:0\">{{ d.n }}<\u002Fspan>\n                        <\u002Fa>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e;line-height:1.5;margin-bottom:8px\">Files are saved in SharePoint, not through the Hub. The Hub records which file is final.<\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:10px 11px\">\n                      <div style=\"width:28px;height:34px;border-radius:4px;background:#f0eaf8;color:#6b3fa0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:8.5px;font-weight:700;flex-shrink:0\">PDF<\u002Fdiv>\n                      <div style=\"min-width:0;flex:1\">\n                        <div style=\"font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">GFD-poster-A2-r2.pdf<\u002Fdiv>\n                        <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e\">4.2 MB · Luca B. · 31 Aug<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n\n                  <div style=\"padding:15px 18px;border-bottom:1px solid #e4e4de\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">Approvals<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e\">{{ tkApprovedCount }} of 1<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e;margin-bottom:10px;line-height:1.5\">Marketing signs off. Whoever wrote the brief confirms the artwork answers it.<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px\">\n                      <sc-for list=\"{{ tkApprovers }}\" as=\"a\" hint-placeholder-count=\"2\">\n                        <div style=\"{{ a.cardCss }}\">\n                          <div style=\"display:flex;align-items:center;gap:9px\">\n                            <div style=\"{{ a.avCss }}\">{{ a.initials }}<\u002Fdiv>\n                            <div style=\"min-width:0;flex:1\">\n                              <div style=\"font-size:12px;font-weight:600\">{{ a.name }}<\u002Fdiv>\n                              <div style=\"font-size:10.5px;color:#88887e\">{{ a.why }}<\u002Fdiv>\n                            <\u002Fdiv>\n                            <div style=\"{{ a.pillCss }}\">{{ a.state }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ a.pending }}\" hint-placeholder-val=\"{{ true }}\">\n                            <div style=\"display:flex;gap:6px;margin-top:9px\">\n                              <button sc-camel-on-click=\"{{ a.approve }}\" style=\"flex:1;padding:6px;background:#0a6640;color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:700;cursor:pointer\">Approve<\u002Fbutton>\n                              <button sc-camel-on-click=\"{{ a.reject }}\" style=\"flex:1;padding:6px;background:#fff;color:#44443e;border:1px solid #e4e4de;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer\" style-hover=\"background:#f2f2ef\">Request changes<\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ tkAllApproved }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:10px;padding:10px 12px;background:#e8f5ee;border:1px solid #c8e5d6;border-radius:9px;font-size:11.5px;color:#0a6640;line-height:1.5\"><strong>Approved.<\u002Fstrong> This job closes. The activity moves to Live once the other three are done.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n\n                  <div style=\"padding:15px 18px\">\n                    <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:10px\">Rounds<\u002Fdiv>\n                    <div style=\"display:flex;flex-direction:column;gap:8px\">\n                      <sc-for list=\"{{ tkRounds }}\" as=\"r\" hint-placeholder-count=\"2\">\n                        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:10px 11px\">\n                          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px\">\n                            <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;font-weight:700;color:#44443e\">R{{ r.n }}<\u002Fspan>\n                            <span style=\"{{ r.pillCss }}\">{{ r.verdict }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <div style=\"font-size:11.5px;color:#0f0f0d;line-height:1.5\">{{ r.note }}<\u002Fdiv>\n                          <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#a8a89e;margin-top:4px\">{{ r.who }} · {{ r.when }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n              <div style=\"padding:13px 17px;border-bottom:1px solid #e4e4de\">\n                <div style=\"font-size:13px;font-weight:700\">Write contract<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#88887e;margin-top:3px;line-height:1.5;max-width:720px;text-wrap:pretty\">What this ticket sends to <span style=\"font-family:'DM Mono',monospace;font-size:11px\">My Tasks<\u002Fspan> on each change. The rows marked New do not exist yet — {{ contractNewCount }} of them, and they are the schema decisions to make before wiring it up.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"min-width:700px\">\n                  <div style=\"display:grid;grid-template-columns:1.1fr 1.2fr .7fr 1.5fr;padding:9px 17px;border-bottom:1px solid #e4e4de;background:#fbfbf9;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">\n                    <div>Ticket field<\u002Fdiv><div>SharePoint column<\u002Fdiv><div>Type<\u002Fdiv><div>Rule<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ contract }}\" as=\"c\" hint-placeholder-count=\"12\">\n                    <div style=\"display:grid;grid-template-columns:1.1fr 1.2fr .7fr 1.5fr;padding:9px 17px;border-bottom:1px solid #f2f2ef;font-size:11.5px;align-items:start\">\n                      <div style=\"padding-right:10px;font-weight:600\">{{ c.field }}<\u002Fdiv>\n                      <div style=\"padding-right:10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap\">\n                        <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#44443e\">{{ c.col }}<\u002Fspan>\n                        <sc-if value=\"{{ c.isNew }}\" hint-placeholder-val=\"{{ false }}\">\n                          <span style=\"padding:1px 6px;border-radius:9px;background:#fdf3e0;color:#8a6410;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">New<\u002Fspan>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                      <div style=\"padding-right:10px;color:#88887e;font-size:11px\">{{ c.type }}<\u002Fdiv>\n                      <div style=\"color:#44443e;line-height:1.45;font-size:11px\">{{ c.rule }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isInbox }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Discussion<\u002Fdiv>\n                <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Inbox<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">{{ inboxBlurb }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ inboxFilters }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <button sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.css }}\">{{ f.label }}<span style=\"{{ f.nCss }}\">{{ f.n }}<\u002Fspan><\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(240px,306px) minmax(0,1fr);gap:14px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <sc-for list=\"{{ threads }}\" as=\"t\" hint-placeholder-count=\"5\">\n                  <div sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.css }}\">\n                    <div style=\"{{ t.unreadCss }}\"><\u002Fdiv>\n                    <div style=\"min-width:0;flex:1\">\n                      <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:2px\">\n                        <div style=\"{{ t.venueDot }}\"><\u002Fdiv>\n                        <span style=\"font-size:10px;color:#88887e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.venue }}<\u002Fspan>\n                        <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#a8a89e;margin-left:auto;white-space:nowrap\">{{ t.ago }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"{{ t.titleCss }}\">{{ t.title }}<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#88887e;line-height:1.4;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical\">{{ t.snippet }}<\u002Fdiv>\n                      <sc-if value=\"{{ t.needsReply }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div style=\"display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:2px 7px;border-radius:11px;background:#fdf3e0;color:#8a6410;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">Waiting on you<\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;display:flex;flex-direction:column;min-height:520px\">\n                <div style=\"padding:13px 17px;border-bottom:1px solid #e4e4de;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap\">\n                  <div style=\"min-width:0;flex:1 1 240px\">\n                    <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:3px\">\n                      <div style=\"{{ openThread.venueDot }}\"><\u002Fdiv>\n                      <span style=\"font-size:11px;color:#88887e\">{{ openThread.venue }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'DM Serif Display',serif;font-size:18px;letter-spacing:-.02em;line-height:1.15\">{{ openThread.title }}<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ goDetail }}\" style=\"font-size:11px;color:#0a6640;font-weight:600;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0;margin-top:4px\">Open the activity →<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:8px\">\n                    <div style=\"display:flex\">\n                      <sc-for list=\"{{ openThread.people }}\" as=\"p\" hint-placeholder-count=\"3\">\n                        <div style=\"{{ p.css }}\" title=\"{{ p.name }}\">{{ p.initials }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <button style=\"padding:6px 11px;border:1px solid #e4e4de;background:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;color:#44443e;white-space:nowrap\" style-hover=\"background:#f2f2ef\">+ Add someone<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;padding:16px 17px;display:flex;flex-direction:column;gap:11px;background:#fbfbf9\">\n                  <sc-for list=\"{{ openThread.msgs }}\" as=\"m\" hint-placeholder-count=\"4\">\n                    <div style=\"{{ m.rowCss }}\">\n                      <div style=\"{{ m.avCss }}\">{{ m.initials }}<\u002Fdiv>\n                      <div style=\"{{ m.wrapCss }}\">\n                        <div style=\"display:flex;align-items:baseline;gap:7px;margin-bottom:3px\">\n                          <span style=\"font-size:11px;font-weight:700;color:#44443e\">{{ m.who }}<\u002Fspan>\n                          <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#a8a89e\">{{ m.when }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"{{ m.bubbleCss }}\">{{ m.text }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"padding:11px 17px;border-top:1px solid #e4e4de\">\n                  <textarea placeholder=\"Reply…\" rows=\"2\" style=\"width:100%;font-family:'DM Sans',sans-serif;font-size:12.5px;padding:9px 10px;border:1px solid #e4e4de;border-radius:8px;resize:vertical;color:#0f0f0d;box-sizing:border-box\"><\u002Ftextarea>\n                  <div style=\"display:flex;align-items:center;gap:12px;margin-top:7px;flex-wrap:wrap\">\n                    <label style=\"display:flex;align-items:center;gap:6px;font-size:11.5px;color:#88887e;cursor:pointer\"><input type=\"checkbox\"> Email participants<\u002Flabel>\n                    <button style=\"padding:6px 15px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;margin-left:auto\">Send<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isActivities }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Planning<\u002Fdiv>\n                <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Activities<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">{{ actCountLabel }}.{{ actBlurb }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:5px;align-items:center;background:#0f120f;border-radius:8px;padding:3px\">\n                <sc-for list=\"{{ actViews }}\" as=\"v\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ v.pick }}\" style=\"{{ v.css }}\">{{ v.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:14px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:10px 13px;margin-bottom:12px\">\n              <sc-if value=\"{{ actShowStageChips }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"display:flex;gap:5px;flex-wrap:wrap;align-items:center\">\n                  <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-right:2px\">Stage<\u002Fspan>\n                  <sc-for list=\"{{ actStageChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n                    <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }} <span style=\"font-family:'DM Mono',monospace;opacity:.6\">{{ c.n }}<\u002Fspan><\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ actIsPipe }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"font-size:11.5px;color:#88887e\">Stage is the board's own axis — filter by venue instead.<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-left:auto\">\n                <span style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-right:2px\">Venue<\u002Fspan>\n                <sc-for list=\"{{ actVenueChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ actIsList }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"display:grid;grid-template-columns:2fr 1fr .8fr 1fr .9fr .9fr;gap:0;padding:9px 15px;border-bottom:1px solid #e4e4de;background:#fbfbf9;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">\n                  <div>Activity<\u002Fdiv><div>Venue<\u002Fdiv><div>Type<\u002Fdiv><div>When<\u002Fdiv><div>Stage<\u002Fdiv><div>Jobs<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ actRows }}\" as=\"a\" hint-placeholder-count=\"9\">\n                  <div sc-camel-on-click=\"{{ a.go }}\" style=\"display:grid;grid-template-columns:2fr 1fr .8fr 1fr .9fr .9fr;gap:0;padding:11px 15px;border-bottom:1px solid #f2f2ef;align-items:center;font-size:12.5px;cursor:pointer\" style-hover=\"background:#fbfbf9\">\n                    <div style=\"min-width:0;padding-right:10px\">\n                      <div style=\"font-weight:600;line-height:1.3\">{{ a.title }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#88887e;margin-top:2px\">{{ a.funnel }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:7px;min-width:0;padding-right:10px\">\n                      <div style=\"{{ a.venueDot }}\"><\u002Fdiv>\n                      <span style=\"font-size:11.5px;color:#44443e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.venue }}<\u002Fspan>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#44443e\">{{ a.type }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#44443e\">{{ a.when }}<\u002Fdiv>\n                    <div><span style=\"{{ a.stageCss }}\">{{ a.stage }}<\u002Fspan><\u002Fdiv>\n                    <div style=\"display:flex;align-items:center;gap:7px\">\n                      <div style=\"flex:1;height:4px;border-radius:3px;background:#f2f2ef;overflow:hidden;max-width:52px\">\n                        <div style=\"{{ a.barCss }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <span style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;white-space:nowrap\">{{ a.jobs }}<\u002Fspan>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ actEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:44px;text-align:center;font-size:12.5px;color:#88887e\">Nothing matches those filters.<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ actIsPipe }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:11px;align-items:start\">\n                <sc-for list=\"{{ actPipe }}\" as=\"col\" hint-placeholder-count=\"6\">\n                  <div style=\"background:#f2f2ef;border:1px solid #e4e4de;border-radius:11px;padding:9px;display:flex;flex-direction:column;gap:7px\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:center;padding:2px 4px\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#44443e\">{{ col.name }}<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">{{ col.n }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ col.items }}\" as=\"a\" hint-placeholder-count=\"2\">\n                      <div sc-camel-on-click=\"{{ a.go }}\" style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:10px 11px;cursor:pointer\" style-hover=\"border-color:#0a6640\">\n                        <div style=\"display:flex;align-items:center;gap:6px;margin-bottom:5px\">\n                          <div style=\"{{ a.venueDot }}\"><\u002Fdiv>\n                          <span style=\"font-size:10px;color:#88887e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ a.venue }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:12px;font-weight:600;line-height:1.35\">{{ a.title }}<\u002Fdiv>\n                        <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:7px;border-top:1px solid #f2f2ef;font-family:'DM Mono',monospace;font-size:10px;color:#88887e\">\n                          <span>{{ a.when }}<\u002Fspan><span>{{ a.jobs }}<\u002Fspan>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ col.empty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:18px 8px;text-align:center;font-size:11px;color:#a8a89e\">Empty<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isOps }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"margin-bottom:16px\">\n              <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Management view<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Operations Map<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#88887e;margin-top:3px;max-width:640px;line-height:1.55;text-wrap:pretty\">{{ opsBlurb }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:14px\">\n              <sc-for list=\"{{ opsStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"{{ s.css }}\">\n                  <div style=\"font-family:'DM Mono',monospace;font-size:27px;letter-spacing:-.03em;line-height:1;{{ s.numColor }}\">{{ s.n }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#88887e;margin-top:5px;font-weight:500\">{{ s.label }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;align-items:start;margin-bottom:14px\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:11px 15px;border-bottom:1px solid #e4e4de;font-size:13px;font-weight:700\">Waiting on a decision<\u002Fdiv>\n                <sc-for list=\"{{ opsBlockers }}\" as=\"b\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:11px 15px;border-bottom:1px solid #f2f2ef\">\n                    <div style=\"display:flex;justify-content:space-between;gap:10px;align-items:flex-start\">\n                      <div style=\"font-size:12.5px;font-weight:600;line-height:1.35;min-width:0\">{{ b.title }}<\u002Fdiv>\n                      <div style=\"{{ b.pillCss }}\">{{ b.tag }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11px;color:#88887e;margin-top:4px;line-height:1.45\">{{ b.why }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#a8a89e;margin-top:4px\">{{ b.meta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:11px 15px;border-bottom:1px solid #e4e4de;display:flex;justify-content:space-between;align-items:center\">\n                  <div style=\"font-size:13px;font-weight:700\">Who is carrying it<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#88887e\">Open items this fortnight<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ opsPeople }}\" as=\"p\" hint-placeholder-count=\"4\">\n                  <div style=\"padding:11px 15px;border-bottom:1px solid #f2f2ef\">\n                    <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:7px\">\n                      <div style=\"{{ p.avCss }}\">{{ p.initials }}<\u002Fdiv>\n                      <div style=\"min-width:0;flex:1\">\n                        <div style=\"font-size:12.5px;font-weight:600\">{{ p.name }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e\">{{ p.role }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#44443e\">{{ p.open }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"height:6px;border-radius:4px;background:#f2f2ef;overflow:hidden;display:flex\">\n                      <div style=\"{{ p.okCss }}\"><\u002Fdiv>\n                      <div style=\"{{ p.lateCss }}\"><\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e;margin-top:5px\">{{ p.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n              <div style=\"padding:11px 15px;border-bottom:1px solid #e4e4de;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap\">\n                <div style=\"font-size:13px;font-weight:700\">What relies on what<\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#88887e\">Dependencies the current build has to infer. Four fields in the list would make them real.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"overflow-x:auto\">\n                <div style=\"min-width:660px\">\n                  <div style=\"display:grid;grid-template-columns:1.5fr 1.4fr 1.4fr .8fr .6fr;padding:9px 15px;border-bottom:1px solid #e4e4de;background:#fbfbf9;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">\n                    <div>Work item<\u002Fdiv><div>Needs first<\u002Fdiv><div>Feeds next<\u002Fdiv><div>Owner<\u002Fdiv><div>Due<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ opsDeps }}\" as=\"d\" hint-placeholder-count=\"6\">\n                    <div style=\"display:grid;grid-template-columns:1.5fr 1.4fr 1.4fr .8fr .6fr;padding:11px 15px;border-bottom:1px solid #f2f2ef;font-size:12px;align-items:start;gap:0\">\n                      <div style=\"padding-right:12px\">\n                        <div style=\"font-weight:600;line-height:1.35\">{{ d.title }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e;margin-top:2px\">{{ d.cat }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"padding-right:12px;color:#44443e;line-height:1.45;font-size:11.5px\">{{ d.needs }}<\u002Fdiv>\n                      <div style=\"padding-right:12px;color:#44443e;line-height:1.45;font-size:11.5px\">{{ d.feeds }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;color:#44443e\">{{ d.owner }}<\u002Fdiv>\n                      <div style=\"{{ d.dueCss }}\">{{ d.due }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isBoard }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"margin-bottom:16px\">\n              <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.02em;margin-bottom:3px\">Artwork<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#88887e;line-height:1.5;max-width:680px;text-wrap:pretty\">One piece of artwork per activity, month after month. Scroll for earlier and later months. Each board image is a design-approved file nominated from the activity's own folder — this page never uploads, and any filename or folder opens in SharePoint.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(172px,1fr));gap:11px;margin-bottom:16px\">\n              <sc-for list=\"{{ bdStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:14px 16px\">\n                  <div style=\"{{ s.numCss }}\">{{ s.n }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;font-weight:600;color:#44443e;margin-bottom:3px\">{{ s.l }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.4\">{{ s.s }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"position:sticky;top:90px;z-index:30;background:#f7f7f5;padding:9px 0;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid #e4e4de\">\n              <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                <sc-for list=\"{{ bdVenChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n                  <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <div style=\"display:flex;gap:2px;background:#f2f2ef;border-radius:15px;padding:2px\">\n                <sc-for list=\"{{ bdGroupToggle }}\" as=\"t\" hint-placeholder-count=\"2\">\n                  <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.css }}\">{{ t.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"text-align:center;padding:10px 0 16px\">\n              <button style=\"padding:6px 14px;background:#fff;border:1px solid #e4e4de;border-radius:15px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:#88887e;cursor:pointer\">↑ Earlier months<\u002Fbutton>\n            <\u002Fdiv>\n\n            <sc-for list=\"{{ bdMonths }}\" as=\"m\" hint-placeholder-count=\"3\">\n              <div style=\"margin-bottom:30px\">\n                <div style=\"position:sticky;top:139px;z-index:20;background:#f7f7f5;padding:6px 0 9px;margin-bottom:12px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap\">\n                  <div style=\"font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:-.02em\">{{ m.label }}<\u002Fdiv>\n                  <sc-if value=\"{{ m.isNow }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"{{ m.nowCss }}\">This month<\u002Fspan>\n                  <\u002Fsc-if>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                  <div style=\"{{ m.countCss }}\">{{ m.count }}<\u002Fdiv>\n                <\u002Fdiv>\n\n                <sc-for list=\"{{ m.lanes }}\" as=\"v\" hint-placeholder-count=\"3\">\n                  <div style=\"margin-bottom:18px\">\n                    <sc-if value=\"{{ v.showHeader }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div style=\"display:flex;align-items:center;gap:9px;padding-bottom:7px;margin-bottom:10px;border-bottom:1px solid #e4e4de\">\n                        <div style=\"{{ v.dot }}\"><\u002Fdiv>\n                        <div style=\"font-size:12.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0\">{{ v.name }}<\u002Fdiv>\n                        <a href=\"#\" title=\"{{ v.folder }}\" style=\"font-size:11px;font-weight:600;color:#0a6640;text-decoration:none;white-space:nowrap\">Venue folder ↗<\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:12px\">\n                      <sc-for list=\"{{ v.cards }}\" as=\"c\" hint-placeholder-count=\"2\">\n                        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;overflow:hidden;display:flex;flex-direction:column\">\n                          <div style=\"{{ c.frameCss }}\">\n                            <sc-if value=\"{{ c.isNojob }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:14px;text-align:center\">\n                                <div style=\"font-size:17px;color:#c8c8c0\">◌<\u002Fdiv>\n                                <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.4\">No artwork job raised<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.isPending }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;background:#f4f0fd\">\n                                <div style=\"font-size:17px;color:#6b3fa0\">◔<\u002Fdiv>\n                                <div style=\"font-size:10.5px;font-weight:600;color:#59348a;line-height:1.4\">{{ c.pendingTxt }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.isUnpicked }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:14px;text-align:center;background:#fdf6e3\">\n                                <div style=\"font-size:17px;color:#b8860b\">◱<\u002Fdiv>\n                                <div style=\"font-size:10.5px;font-weight:600;color:#8a6410;line-height:1.4\">{{ c.unpickedTxt }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                            <sc-if value=\"{{ c.isSet }}\" hint-placeholder-val=\"{{ true }}\">\n                              <image-slot id=\"{{ c.slotId }}\" shape=\"rect\" placeholder=\"Board image renders from Graph\"><\u002Fimage-slot>\n                            <\u002Fsc-if>\n                          <\u002Fdiv>\n                          <div style=\"padding:10px 12px;display:flex;flex-direction:column;gap:5px;flex:1\">\n                            <sc-if value=\"{{ c.showVenue }}\" hint-placeholder-val=\"{{ false }}\">\n                              <div style=\"display:flex;align-items:center;gap:6px\">\n                                <div style=\"{{ c.dot }}\"><\u002Fdiv>\n                                <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ c.venue }}<\u002Fdiv>\n                              <\u002Fdiv>\n                            <\u002Fsc-if>\n                            <div style=\"font-size:12px;font-weight:600;color:#0f0f0d;line-height:1.3\">{{ c.title }}<\u002Fdiv>\n                            <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e\">{{ c.when }}<\u002Fdiv>\n                            <div><span style=\"{{ c.tone }}\">{{ c.toneLabel }}<\u002Fspan><\u002Fdiv>\n                            <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.4\">{{ c.meta }}<\u002Fdiv>\n                            <sc-if value=\"{{ c.isSet }}\" hint-placeholder-val=\"{{ false }}\">\n                              <a href=\"#\" title=\"{{ c.folder }}\" style=\"font-family:'DM Mono',monospace;font-size:10px;color:#0a6640;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block\">{{ c.art.board }} ↗<\u002Fa>\n                            <\u002Fsc-if>\n                            <div style=\"flex:1\"><\u002Fdiv>\n                            <div style=\"display:flex;gap:6px;margin-top:3px\">\n                              <button sc-camel-on-click=\"{{ c.open }}\" style=\"flex:1;padding:6px 11px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:#44443e;cursor:pointer\" style-hover=\"border-color:#0a6640;color:#0a6640\">Manage<\u002Fbutton>\n                              <a href=\"#\" title=\"{{ c.folder }}\" style=\"padding:6px 10px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-size:11px;font-weight:600;color:#44443e;text-decoration:none;white-space:nowrap\" style-hover=\"border-color:#0a6640;color:#0a6640\">Folder ↗<\u002Fa>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n\n            <div style=\"text-align:center;padding:4px 0 20px\">\n              <button style=\"padding:6px 14px;background:#fff;border:1px solid #e4e4de;border-radius:15px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;color:#88887e;cursor:pointer\">↓ Later months<\u002Fbutton>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;gap:12px;flex-wrap:wrap;padding-top:20px;border-top:1px solid #e4e4de\">\n              <div style=\"flex:1;min-width:270px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px\">\n                <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">The board stores a pointer, not a picture<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;text-wrap:pretty\">Nominating writes the SharePoint drive item id to <span style=\"font-family:'DM Mono',monospace;font-size:11px\">BoardImageId<\u002Fspan> on the activity. Artwork and the Calendar both render its Graph thumbnail. There is no second copy, so replacing the file in SharePoint updates every screen at once.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"flex:1;min-width:270px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px\">\n                <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">This page cannot put files in the folder<\u002Fdiv>\n                <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;text-wrap:pretty\">Artwork arrives through the Design Task — briefed, produced, reviewed, approved. Only approved files can be nominated. A page that could upload straight to the board would be a way around design approval, so it does not have one.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ bdOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:fixed;inset:0;background:rgba(15,18,15,.42);z-index:90;display:flex;justify-content:flex-end\">\n            <div sc-camel-on-click=\"{{ bdClose }}\" style=\"flex:1\"><\u002Fdiv>\n            <div style=\"width:min(440px,92vw);background:#f7f7f5;border-left:1px solid #e4e4de;display:flex;flex-direction:column;overflow-y:auto\">\n              <div style=\"padding:16px 18px;background:#fff;border-bottom:1px solid #e4e4de;display:flex;align-items:flex-start;gap:12px\">\n                <div style=\"flex:1;min-width:0\">\n                  <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e;margin-bottom:4px\">Board artwork<\u002Fdiv>\n                  <div style=\"font-size:14px;font-weight:700;line-height:1.3;margin-bottom:3px\">{{ bdActName }}<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#88887e;margin-bottom:5px\">{{ bdActVenue }}<\u002Fdiv>\n                  <a href=\"#\" style=\"font-family:'DM Mono',monospace;font-size:10px;color:#0a6640;line-height:1.5;word-break:break-word;text-decoration:none;display:inline-block\">{{ bdActPath }} ↗<\u002Fa>\n                <\u002Fdiv>\n                <button sc-camel-on-click=\"{{ bdClose }}\" style=\"background:none;border:none;font-size:17px;color:#88887e;cursor:pointer;line-height:1;padding:0\">×<\u002Fbutton>\n              <\u002Fdiv>\n\n              <div style=\"padding:16px 18px;display:flex;flex-direction:column;gap:14px\">\n                <sc-if value=\"{{ bdActPreview }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div>\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e\">On the board now<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">BoardImageId<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"aspect-ratio:4/5;max-height:290px;border-radius:9px;overflow:hidden;background:#f2f2ef;border:1px solid #e4e4de\">\n                      <image-slot id=\"{{ bdActSlot }}\" shape=\"rect\" placeholder=\"Board image renders from Graph\"><\u002Fimage-slot>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:3px\">\n                    <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e\">Design-approved files<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#a8a89e\">Nominate one<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.45;margin-bottom:9px\">Everything the design task has signed off. Unapproved rounds are listed but cannot be nominated.<\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:7px\">\n                    <sc-for list=\"{{ bdFiles }}\" as=\"f\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex;flex-direction:column;gap:3px\">\n                        <button sc-camel-on-click=\"{{ f.pick }}\" style=\"{{ f.rowCss }}\">\n                          <div style=\"{{ f.radioCss }}\"><\u002Fdiv>\n                          <div style=\"flex:1;min-width:0\">\n                            <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#0f0f0d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ f.n }}<\u002Fdiv>\n                            <div style=\"font-size:10.5px;color:#a8a89e;margin-top:2px\">{{ f.meta }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ f.note }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"font-size:10px;color:#a8a89e;line-height:1.35;max-width:96px;text-align:right\">{{ f.note }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fbutton>\n                        <a href=\"#\" title=\"Open this file in SharePoint\" style=\"align-self:flex-start;margin-left:27px;font-size:10px;font-weight:600;color:#0a6640;text-decoration:none\">Open file ↗<\u002Fa>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ bdNoFiles }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:20px;text-align:center;background:#fff;border:1px solid #e4e4de;border-radius:9px;font-size:11.5px;color:#88887e;line-height:1.5\">No design task has produced artwork for this activity yet.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:13px 15px\">\n                  <div style=\"font-size:11.5px;font-weight:700;margin-bottom:4px\">How files get here<\u002Fdiv>\n                  <div style=\"font-size:11px;color:#88887e;line-height:1.5;margin-bottom:10px;text-wrap:pretty\">The designer uploads into the activity folder as part of the design task. Marketing and the venue manager approve. Approved files appear above. This drawer nominates one of them and nothing else.<\u002Fdiv>\n                  <sc-if value=\"{{ bdActJob }}\" hint-placeholder-val=\"{{ false }}\">\n                    <a href=\"#\" style=\"display:inline-block;padding:7px 13px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-size:11.5px;font-weight:600;color:#44443e;text-decoration:none\" style-hover=\"border-color:#0a6640;color:#0a6640\">Open design task: {{ bdActJob }} →<\u002Fa>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"background:#fdf6e3;border:1px solid #f0e2b8;border-radius:9px;padding:11px 13px;font-size:11px;color:#44443e;line-height:1.5\">Nominating replaces whatever is on the board. One activity, one piece — the board is a month at a glance, not a gallery.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:auto;padding:13px 18px;background:#fff;border-top:1px solid #e4e4de;display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0\">\n                <button sc-camel-on-click=\"{{ bdClose }}\" style=\"padding:9px 15px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:600;color:#44443e;cursor:pointer\">Cancel<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ bdClose }}\" style=\"{{ bdSaveCss }}\">Set as board image<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isFinance }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:2px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.02em;margin-bottom:3px\">Finance<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#88887e;line-height:1.5;max-width:640px;text-wrap:pretty\">Marketing budget, the card log and statement reconciliation in one place. Marketing categories only — plumbers, vehicles and groceries stay in Frank Finance.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;align-items:center;gap:9px;background:#fff;border:1px solid #e4e4de;border-radius:8px;padding:5px 7px\">\n                <button style=\"background:none;border:none;cursor:pointer;color:#88887e;font-size:13px;padding:0 3px;line-height:1\">‹<\u002Fbutton>\n                <div style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;white-space:nowrap\">September 2026<\u002Fdiv>\n                <button style=\"background:none;border:none;cursor:pointer;color:#88887e;font-size:13px;padding:0 3px;line-height:1\">›<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;border-bottom:1px solid #e4e4de;margin-bottom:18px\">\n              <sc-for list=\"{{ finTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.css }}\">\n                  <span>{{ t.label }}<\u002Fspan>\n                  <sc-if value=\"{{ t.n }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"{{ t.nCss }}\">{{ t.n }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ finIsBudget }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:11px;margin-bottom:14px\">\n                <sc-for list=\"{{ finStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:14px 16px\">\n                    <div style=\"{{ s.numCss }}\">{{ s.n }}<\u002Fdiv>\n                    <div style=\"font-size:11.5px;font-weight:600;color:#44443e;margin-bottom:3px\">{{ s.l }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.4\">{{ s.s }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <button sc-camel-on-click=\"{{ finGoLog }}\" style=\"width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:11px 14px;background:#fdf6e3;border:1px solid #f0e2b8;border-radius:9px;margin-bottom:16px;cursor:pointer;font-family:'DM Sans',sans-serif\">\n                <span style=\"font-size:13px;color:#b8860b\">◔<\u002Fspan>\n                <span style=\"font-size:12px;color:#44443e;line-height:1.45\"><strong>{{ finFlagCount }} transactions need attention<\u002Fstrong> before this month can be reconciled. Missing receipts and purchases with no activity linked.<\u002Fspan>\n                <span style=\"flex:1\"><\u002Fspan>\n                <span style=\"font-size:11.5px;font-weight:600;color:#0a6640;white-space:nowrap\">Open card log →<\u002Fspan>\n              <\u002Fbutton>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n                <div style=\"padding:13px 16px;border-bottom:1px solid #e4e4de\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:2px\">Venue budgets<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.45\">Each venue gets a month figure. Card spend draws it down as it lands, not at close.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1fr);column-gap:10px;padding:8px 16px;background:#fbfbf9;border-bottom:1px solid #e4e4de;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#88887e\">\n                  <div>Venue<\u002Fdiv><div style=\"text-align:right\">Allocated<\u002Fdiv><div style=\"text-align:right\">Spent<\u002Fdiv><div style=\"text-align:right\">Committed<\u002Fdiv><div style=\"text-align:right\">Remaining<\u002Fdiv><div style=\"padding-left:16px\">Used<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ finVenueRows }}\" as=\"v\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr) minmax(0,.9fr) minmax(0,1fr);column-gap:10px;padding:11px 16px;border-bottom:1px solid #f2f2ef;align-items:center\">\n                    <div style=\"display:flex;align-items:center;gap:8px;min-width:0\">\n                      <div style=\"{{ v.dot }}\"><\u002Fdiv>\n                      <div style=\"font-size:12px;font-weight:600;color:#0f0f0d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ v.name }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#44443e;text-align:right\">{{ v.alloc }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#44443e;text-align:right\">{{ v.spent }}<\u002Fdiv>\n
