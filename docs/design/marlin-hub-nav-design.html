                    <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#88887e;text-align:right\">{{ v.comm }}<\u002Fdiv>\n                    <div style=\"{{ v.leftCss }}\">{{ v.left }}<\u002Fdiv>\n                    <div style=\"padding-left:16px;display:flex;align-items:center;gap:9px\">\n                      <div style=\"flex:1;height:6px;background:#f2f2ef;border-radius:3px;overflow:hidden;display:flex\">\n                        <div style=\"{{ v.spentBar }}\"><\u002Fdiv>\n                        <div style=\"{{ v.commBar }}\"><\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;width:32px;text-align:right\">{{ v.pct }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <div style=\"padding:9px 16px;display:flex;gap:16px;align-items:center;background:#fbfbf9\">\n                  <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:9px;height:6px;border-radius:2px;background:#0a6640\"><\u002Fdiv><span style=\"font-size:10.5px;color:#88887e\">Spent<\u002Fspan><\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:6px\"><div style=\"width:9px;height:6px;border-radius:2px;background:#0a664040\"><\u002Fdiv><span style=\"font-size:10.5px;color:#88887e\">Committed, not yet billed<\u002Fspan><\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n                <div style=\"padding:13px 16px;border-bottom:1px solid #e4e4de\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:2px\">Activity draw-down<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.45\">Spend is the sum of card transactions linked to the activity. Nobody types a total at close. Where a real cost never touched a card, it is added as a stated adjustment.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.1fr) minmax(0,.8fr);column-gap:10px;padding:8px 16px;background:#fbfbf9;border-bottom:1px solid #e4e4de;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#88887e\">\n                  <div>Activity<\u002Fdiv><div style=\"text-align:right\">Allocated<\u002Fdiv><div style=\"text-align:right\">On card<\u002Fdiv><div style=\"text-align:right\">Actual spend<\u002Fdiv><div style=\"text-align:right\">Remaining<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ finActs }}\" as=\"a\" hint-placeholder-count=\"4\">\n                  <div style=\"border-bottom:1px solid #f2f2ef\">\n                    <div sc-camel-on-click=\"{{ a.go }}\" style=\"display:grid;grid-template-columns:minmax(0,2fr) minmax(0,.7fr) minmax(0,.7fr) minmax(0,1.1fr) minmax(0,.8fr);column-gap:10px;padding:11px 16px;align-items:center;cursor:pointer\" style-hover=\"background:#fbfbf9\">\n                      <div style=\"display:flex;align-items:center;gap:8px;min-width:0;padding-right:12px\">\n                        <div style=\"{{ a.dot }}\"><\u002Fdiv>\n                        <div style=\"min-width:0\">\n                          <div style=\"font-size:12px;font-weight:600;color:#0f0f0d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ a.name }}<\u002Fdiv>\n                          <div style=\"font-size:10.5px;color:#a8a89e\">{{ a.venue }}<\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#44443e;text-align:right\">{{ a.allocTxt }}<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#88887e;text-align:right\">{{ a.cardTxt }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:6px;flex-wrap:wrap;min-width:0\">\n                        <span style=\"{{ a.srcCss }}\">{{ a.srcLabel }}<\u002Fspan>\n                        <span style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#0f0f0d\">{{ a.totalTxt }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"{{ a.leftCss }}\">{{ a.leftTxt }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ a.why }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:0 16px 11px 40px;font-size:11px;color:#c05c1a;line-height:1.45\">Adjustment {{ a.overTxt }} — {{ a.why }}<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:13px 16px;border-bottom:1px solid #e4e4de\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:2px\">Committed, not yet billed<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.45\">Approved orders with no transaction yet. Held against the budget so a venue cannot spend the same money twice.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ finCommits }}\" as=\"c\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid #f2f2ef\">\n                    <div style=\"{{ c.dot }}\"><\u002Fdiv>\n                    <div style=\"flex:1;min-width:0\">\n                      <div style=\"font-size:12px;font-weight:600;color:#0f0f0d\">{{ c.sup }} — {{ c.desc }}<\u002Fdiv>\n                      <div style=\"font-size:10.5px;color:#a8a89e\">{{ c.venue }} · {{ c.act }} · {{ c.when }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#44443e\">{{ c.amtTxt }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ finIsLog }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n                <div style=\"flex:1 1 620px;min-width:0\">\n                  <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px\">\n                    <sc-for list=\"{{ finVenChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n                      <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px\">\n                    <sc-for list=\"{{ finStatChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                      <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                    <div style=\"display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1.3fr) 52px 82px 62px;column-gap:10px;padding:8px 15px;background:#fbfbf9;border-bottom:1px solid #e4e4de;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#88887e\">\n                      <div>Date<\u002Fdiv><div>Supplier<\u002Fdiv><div>Activity<\u002Fdiv><div>Card<\u002Fdiv><div style=\"text-align:right\">Inc GST<\u002Fdiv><div style=\"text-align:right\">GST<\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-for list=\"{{ finLedger }}\" as=\"t\" hint-placeholder-count=\"8\">\n                      <div style=\"border-bottom:1px solid #f2f2ef\">\n                        <div style=\"display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1.3fr) 52px 82px 62px;column-gap:10px;padding:10px 15px;align-items:center\">\n                          <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">{{ t.d }}<\u002Fdiv>\n                          <div style=\"display:flex;align-items:center;gap:7px;min-width:0;padding-right:10px\">\n                            <div style=\"{{ t.dot }}\"><\u002Fdiv>\n                            <div style=\"font-size:12px;font-weight:600;color:#0f0f0d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ t.sup }}<\u002Fdiv>\n                          <\u002Fdiv>\n                          <div style=\"{{ t.actCss }}\">{{ t.actTxt }}<\u002Fdiv>\n                          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#a8a89e\">···{{ t.card }}<\u002Fdiv>\n                          <div style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#0f0f0d;text-align:right\">{{ t.amtTxt }}<\u002Fdiv>\n                          <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#a8a89e;text-align:right\">{{ t.gstTxt }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"padding:0 15px 9px 15px;display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                          <span style=\"{{ t.catCss }}\">{{ t.cat }}<\u002Fspan>\n                          <span style=\"font-size:10.5px;color:#a8a89e\">{{ t.who }}<\u002Fspan>\n                          <sc-if value=\"{{ t.flag }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"{{ t.flagCss }}\">{{ t.flag }}<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ t.note }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"font-size:10.5px;color:#c05c1a\">{{ t.note }}<\u002Fspan>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                    <sc-if value=\"{{ finLedgerEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:26px;text-align:center;font-size:11.5px;color:#88887e\">Nothing on this card in September under those filters.<\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n                  <div style=\"background:#fff;border:1px dashed #c8c8c0;border-radius:11px;padding:20px 16px;text-align:center\">\n                    <div style=\"font-size:19px;color:#a8a89e;margin-bottom:6px\">⇪<\u002Fdiv>\n                    <div style=\"font-size:12px;font-weight:600;margin-bottom:3px\">Drop a receipt or invoice<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#88887e;line-height:1.45;margin-bottom:11px\">Uploads to the activity folder in SharePoint. The review form opens with the file attached.<\u002Fdiv>\n                    <button style=\"width:100%;padding:8px 14px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;margin-bottom:6px\">Choose a file<\u002Fbutton>\n                    <button style=\"width:100%;padding:8px 14px;background:#fff;color:#44443e;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer\">Add without a file<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:13px 15px\">\n                    <div style=\"font-size:11.5px;font-weight:700;margin-bottom:5px\">Reading the receipt for you is not free here<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#88887e;line-height:1.5;text-wrap:pretty\">Frank Finance pre-fills the form from the image because it runs on a platform with that built in. Inside the Hub the same trick needs a Power Automate flow with AI Builder. Until that exists, the fields are typed. Everything else ports as-is.<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:13px 15px\">\n                    <div style=\"font-size:11.5px;font-weight:700;margin-bottom:5px\">Card is free text today<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#88887e;line-height:1.5;text-wrap:pretty\">Last four digits only, typed by whoever logs it. A proper dropdown of named company cards needs the real list of card holders and last-four digits. None has been invented.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ finIsRec }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n                <div style=\"padding:13px 16px;border-bottom:1px solid #e4e4de;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap\">\n                  <div>\n                    <div style=\"font-size:13px;font-weight:700;margin-bottom:2px\">Statement · card ···4417 · 26 Aug to 25 Sep 2026<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#88887e\">12 lines read from <span style=\"font-family:'DM Mono',monospace;font-size:11px\">anz-4417-sep26.csv<\u002Fspan><\u002Fdiv>\n                  <\u002Fdiv>\n                  <button style=\"padding:7px 14px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#44443e;white-space:nowrap;flex-shrink:0\">Replace file<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"padding:13px 16px;border-bottom:1px solid #e4e4de\">\n                  <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e;margin-bottom:9px\">Columns, as guessed from the header row<\u002Fdiv>\n                  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px\">\n                    <sc-for list=\"{{ finMapCols }}\" as=\"c\" hint-placeholder-count=\"5\">\n                      <div style=\"border:1px solid #e4e4de;border-radius:8px;padding:8px 11px;min-width:132px\">\n                        <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#a8a89e;margin-bottom:3px\">Column {{ c.col }}<\u002Fdiv>\n                        <div style=\"font-size:11.5px;font-weight:600;color:#0f0f0d;margin-bottom:5px\">{{ c.head }}<\u002Fdiv>\n                        <div style=\"{{ c.toCss }}\">{{ c.to }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;align-items:center;gap:9px;padding:9px 12px;background:#fdf6e3;border:1px solid #f0e2b8;border-radius:8px\">\n                    <span style=\"font-size:11.5px;color:#44443e;line-height:1.45\">Dates read as <strong>DD/MM/YYYY<\u002Fstrong>, Australian order. Shown rather than assumed silently, because reading 03/09 as 9 March quietly ruins the match.<\u002Fspan>\n                    <span style=\"flex:1\"><\u002Fspan>\n                    <button style=\"padding:5px 11px;background:#fff;border:1px solid #e4e4de;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap\">Switch to MM/DD<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:0\">\n                  <sc-for list=\"{{ finRecBuckets }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ b.pick }}\" style=\"{{ b.css }}\">\n                      <div style=\"{{ b.nCss }}\">{{ b.n }}<\u002Fdiv>\n                      <div style=\"font-size:11.5px;font-weight:600;color:#44443e\">{{ b.label }}<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#a8a89e;margin-top:1px\">{{ b.amt }}<\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden;margin-bottom:14px\">\n                <div style=\"padding:11px 16px;border-bottom:1px solid #e4e4de;display:flex;justify-content:space-between;align-items:baseline;gap:12px\">\n                  <div style=\"font-size:13px;font-weight:700\">{{ finBucketLabel }}<\u002Fdiv>\n                  <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#88887e\">{{ finRecTotal }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ finRecRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div style=\"display:grid;grid-template-columns:56px minmax(0,1.2fr) 90px minmax(0,1.6fr);column-gap:12px;padding:11px 16px;border-bottom:1px solid #f2f2ef;align-items:center\">\n                    <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">{{ r.sd }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:11.5px;color:#0f0f0d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px\">{{ r.desc }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:12px;font-weight:600;color:#0f0f0d;text-align:right;padding-right:16px\">{{ r.amtTxt }}<\u002Fdiv>\n                    <div style=\"{{ r.rCss }}\">{{ r.r }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:12px;align-items:stretch;flex-wrap:wrap\">\n                <div style=\"flex:1;min-width:280px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px\">\n                  <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">Out of scope is an answer, not a failure<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;text-wrap:pretty\">The statement carries every purchase on the card. This system holds the marketing ones. Three lines here are hardware, vehicle and groceries — they reconcile in Frank Finance, and the Hub stops asking about them.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:280px;background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px;display:flex;flex-direction:column\">\n                  <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">Send to Sarah<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;margin-bottom:11px;text-wrap:pretty\">Downloads all four sections as one CSV. The Hub cannot email it — this stays a manual forward until a flow is built.<\u002Fdiv>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                  <button style=\"padding:9px 15px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;align-self:flex-start\">Export reconciliation CSV<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isStub }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:520px;margin:60px auto;text-align:center\">\n            <div style=\"font-family:'DM Serif Display',serif;font-size:21px;letter-spacing:-.02em;margin-bottom:7px\">{{ screenTitle }}<\u002Fdiv>\n            <div style=\"font-size:13px;color:#88887e;line-height:1.6\">Not built in this pass. The nav position and grouping are the point here — say the word and I'll design the screen.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isMap }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:28px 30px 60px;max-width:1320px;margin:0 auto;width:100%\">\n\n      <div style=\"margin-bottom:26px\">\n        <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:4px\">Information architecture<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:30px;letter-spacing:-.03em;line-height:1.1\">24 destinations, <em style=\"color:#88887e\">three bins<\u002Fem><\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#44443e;margin-top:7px;max-width:720px;line-height:1.6;text-wrap:pretty\">Main, Work and More don't describe anything. Six of the current items are views of something else, and financial and personal screens sit in the same list as everyone's daily work. The restructure below groups by what you're doing, not by when it got built.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:300px 1fr;gap:22px;align-items:start;margin-bottom:34px\">\n        <div>\n          <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#c0392b;margin-bottom:9px\">Now<\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:12px;display:flex;flex-direction:column;gap:1px\">\n            <sc-for list=\"{{ oldNav }}\" as=\"g\" hint-placeholder-count=\"3\">\n              <div style=\"font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:#88887e;padding:9px 6px 3px\">{{ g.sec }}<\u002Fdiv>\n              <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:4px 6px;font-size:12px;color:#44443e\">\n                  <span style=\"flex:1\">{{ i.label }}<\u002Fspan>\n                  <sc-if value=\"{{ i.tag }}\" hint-placeholder-val=\"{{ false }}\">\n                    <span style=\"{{ i.tagCss }}\">{{ i.tag }}<\u002Fspan>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#0a6640;margin-bottom:9px\">Proposed<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:11px\">\n            <sc-for list=\"{{ newNav }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:10px 13px;background:#0f120f;color:#fff\">\n                  <div style=\"font-size:12.5px;font-weight:700\">{{ g.sec }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px;color:rgba(255,255,255,.45);margin-top:1px\">{{ g.blurb }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"padding:9px 11px;display:flex;flex-direction:column;gap:1px\">\n                  <sc-for list=\"{{ g.items }}\" as=\"i\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;align-items:baseline;gap:7px;padding:4px 2px;font-size:12.5px\">\n                      <span style=\"flex:1;font-weight:500\">{{ i.label }}<\u002Fspan>\n                      <sc-if value=\"{{ i.note }}\" hint-placeholder-val=\"{{ false }}\">\n                        <span style=\"font-size:10px;color:#88887e\">{{ i.note }}<\u002Fspan>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-top:14px\">\n            <sc-for list=\"{{ iaMoves }}\" as=\"m\" hint-placeholder-count=\"4\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:12px 13px\">\n                <div style=\"font-size:11.5px;font-weight:700;margin-bottom:4px;color:#0a6640\">{{ m.h }}<\u002Fdiv>\n                <div style=\"font-size:12px;color:#44443e;line-height:1.5\">{{ m.p }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Does the split hold for every role?<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:16px;max-width:760px;line-height:1.6\">Same five groups for everyone. Only the rows change. Read down a column to see what that person's sidebar actually contains, and how thin some groups get.<\u002Fdiv>\n        <div style=\"overflow-x:auto\">\n          <div style=\"min-width:640px\">\n            <div style=\"display:grid;grid-template-columns:150px repeat(4,1fr);gap:0;border-bottom:1px solid #e4e4de\">\n              <div><\u002Fdiv>\n              <sc-for list=\"{{ roleCols }}\" as=\"r\" hint-placeholder-count=\"4\">\n                <div style=\"padding:9px 11px\">\n                  <div style=\"font-size:12.5px;font-weight:700\">{{ r.name }}<\u002Fdiv>\n                  <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:1px\">{{ r.count }} items<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <sc-for list=\"{{ roleGrid }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display:grid;grid-template-columns:150px repeat(4,1fr);gap:0;border-bottom:1px solid #f2f2ef\">\n                <div style=\"padding:11px;background:#0f120f;color:#fff\">\n                  <div style=\"font-size:11.5px;font-weight:700\">{{ g.sec }}<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ g.cells }}\" as=\"c\" hint-placeholder-count=\"4\">\n                  <div style=\"{{ c.css }}\">\n                    <sc-for list=\"{{ c.items }}\" as=\"i\" hint-placeholder-count=\"3\">\n                      <div style=\"{{ i.css }}\">{{ i.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:11px;margin-top:14px\">\n          <sc-for list=\"{{ roleNotes }}\" as=\"n\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:12px 13px\">\n              <div style=\"font-size:11.5px;font-weight:700;margin-bottom:4px;color:{{ n.tone }}\">{{ n.h }}<\u002Fdiv>\n              <div style=\"font-size:12px;color:#44443e;line-height:1.5\">{{ n.p }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Submit to live<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:16px;max-width:700px;line-height:1.6\">Approval currently changes a stage and sends an email. No job is created, so the Hub says an activity is in design while nobody has been asked to do anything. Step 3 is the fix.<\u002Fdiv>\n        <div style=\"display:flex;gap:0;align-items:stretch;flex-wrap:wrap\">\n          <sc-for list=\"{{ flow }}\" as=\"f\" hint-placeholder-count=\"7\">\n            <div style=\"{{ f.css }}\">\n              <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-bottom:5px\">{{ f.n }}<\u002Fdiv>\n              <div style=\"font-size:13px;font-weight:700;margin-bottom:4px\">{{ f.h }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#44443e;line-height:1.5\">{{ f.p }}<\u002Fdiv>\n              <sc-if value=\"{{ f.flag }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:7px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#c0392b\">{{ f.flag }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Intake to finished<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:18px;max-width:760px;line-height:1.6\">Seven stages. Each one has a gate that must be satisfied before the activity moves, an owner who moves it, and a notification that fires. An activity cannot skip a gate by leaving fields blank — a blank field becomes an outstanding item held against the activity, and the gate stays shut.<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:9px\">\n          <sc-for list=\"{{ lifecycle }}\" as=\"s\" hint-placeholder-count=\"7\">\n            <div style=\"{{ s.rowCss }}\">\n              <div style=\"display:flex;align-items:center;gap:11px;flex-wrap:wrap;margin-bottom:8px\">\n                <div style=\"{{ s.numCss }}\">{{ s.n }}<\u002Fdiv>\n                <div style=\"font-size:14.5px;font-weight:700\">{{ s.name }}<\u002Fdiv>\n                <div style=\"{{ s.stagePill }}\">{{ s.spCol }}<\u002Fdiv>\n                <div style=\"font-size:11px;color:#88887e;margin-left:auto\">Moved by {{ s.owner }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px\">\n                <div>\n                  <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-bottom:4px\">What happens<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#44443e;line-height:1.55\">{{ s.what }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#0a6640;margin-bottom:4px\">Gate out<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#44443e;line-height:1.55\">{{ s.gate }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div>\n                  <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#8a6410;margin-bottom:4px\">Who is told<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#44443e;line-height:1.55\">{{ s.notify }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n              <sc-if value=\"{{ s.stuck }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top:9px;padding:9px 11px;background:#fdf3e0;border-radius:7px;font-size:11px;color:#8a6410;line-height:1.5\">{{ s.stuck }}<\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Where every answer gets completed<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:14px;max-width:760px;line-height:1.6\">Every field on the current submission form, plus the ones the workflow needs and the form never asks for. Nothing is deleted — each is assigned to the point where it is genuinely needed. Filter by gate to see what a stage is waiting on.<\u002Fdiv>\n        <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px\">\n          <sc-for list=\"{{ regChips }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }} <span style=\"font-family:'DM Mono',monospace;opacity:.6\">{{ c.n }}<\u002Fspan><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <div style=\"min-width:720px\">\n              <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .95fr .8fr 1.5fr;padding:9px 15px;border-bottom:1px solid #e4e4de;background:#fbfbf9;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">\n                <div>Field<\u002Fdiv><div>Column<\u002Fdiv><div>Asked at<\u002Fdiv><div>Who fills it<\u002Fdiv><div>What it blocks<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ register }}\" as=\"r\" hint-placeholder-count=\"14\">\n                <div style=\"display:grid;grid-template-columns:1.3fr 1.2fr .95fr .8fr 1.5fr;padding:9px 15px;border-bottom:1px solid #f2f2ef;font-size:11.5px;align-items:start\">\n                  <div style=\"padding-right:10px;font-weight:600;line-height:1.35\">{{ r.field }}<\u002Fdiv>\n                  <div style=\"padding-right:10px;display:flex;align-items:center;gap:5px;flex-wrap:wrap\">\n                    <span style=\"font-family:'DM Mono',monospace;font-size:10px;color:#44443e\">{{ r.col }}<\u002Fspan>\n                    <sc-if value=\"{{ r.isNew }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"padding:1px 5px;border-radius:9px;background:#fdf3e0;color:#8a6410;font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em\">New<\u002Fspan>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"padding-right:8px\"><span style=\"{{ r.gateCss }}\">{{ r.gate }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"padding-right:8px;color:#44443e;font-size:11px\">{{ r.who }}<\u002Fdiv>\n                  <div style=\"color:#88887e;line-height:1.45;font-size:11px\">{{ r.blocks }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">One folder per activity<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:16px;max-width:760px;line-height:1.6\">The same answers that create the jobs create the folder. Nothing is created for an activity that needs no work, and no activity ends up with eleven empty subfolders nobody uses.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;align-items:start\">\n          <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:15px 17px\">\n            <div style=\"font-size:12.5px;font-weight:700;margin-bottom:8px\">Path<\u002Fdiv>\n            <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#44443e;line-height:1.8;word-break:break-word;background:#fbfbf9;border:1px solid #f2f2ef;border-radius:7px;padding:10px 11px\">Marketing / Activities /<br>2026 /<br>Mustang Bar /<br>2026-09-26 Grand Final Day [1042]<\u002Fdiv>\n            <div style=\"font-size:11.5px;color:#44443e;line-height:1.55;margin-top:10px\">Year, then venue, then date and name. Venue sits above date because every screen in the Hub filters by venue first. The trailing SharePoint item id makes the folder collision-proof and lets a folder be traced back to its activity by name alone.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:15px 17px\">\n            <div style=\"font-size:12.5px;font-weight:700;margin-bottom:8px\">Subfolders, by answer<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:4px\">\n              <sc-for list=\"{{ folderRules }}\" as=\"d\" hint-placeholder-count=\"8\">\n                <div style=\"display:flex;align-items:baseline;gap:9px;font-size:11.5px;padding:4px 0;border-bottom:1px solid #f7f7f5\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:11px;color:#0f0f0d;font-weight:600;flex-shrink:0;width:120px\">{{ d.name }}<\u002Fspan>\n                  <span style=\"color:#88887e;line-height:1.45\">{{ d.when }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:15px 17px\">\n            <div style=\"font-size:12.5px;font-weight:700;margin-bottom:8px\">How it is built<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:9px\">\n              <sc-for list=\"{{ folderSteps }}\" as=\"s\" hint-placeholder-count=\"5\">\n                <div style=\"padding-bottom:9px;border-bottom:1px solid #f7f7f5\">\n                  <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#0a6640;font-weight:700;margin-bottom:3px\">{{ s.n }}<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#44443e;line-height:1.55\">{{ s.p }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Chasing what is missing<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:16px;max-width:760px;line-height:1.6\">An outstanding item is not a validation error. It is a record with an owner and a deadline, and it appears in that person's My Day until it is answered. This is the mechanic that stops a half-filled submission quietly stalling.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px\">\n          <sc-for list=\"{{ chaseRules }}\" as=\"c\" hint-placeholder-count=\"4\">\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:13px 14px\">\n              <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#0a6640;font-weight:700;margin-bottom:5px\">{{ c.when }}<\u002Fdiv>\n              <div style=\"font-size:12.5px;font-weight:700;margin-bottom:4px\">{{ c.h }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#44443e;line-height:1.5\">{{ c.p }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px;margin-bottom:32px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">Who gets told what<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:14px;max-width:760px;line-height:1.6\">Every notification the workflow needs, and the channel it uses. Your build already has the two channels — <span style=\"font-family:'DM Mono',monospace;font-size:12px\">sendMentionEmails<\u002Fspan> over Graph, and the Activity Comments thread that feeds Inbox. What is missing is the rule about when each fires.<\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n          <div style=\"overflow-x:auto\">\n            <div style=\"min-width:700px\">\n              <div style=\"display:grid;grid-template-columns:1.1fr 1fr .9fr 1.6fr;padding:9px 15px;border-bottom:1px solid #e4e4de;background:#fbfbf9;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e\">\n                <div>Trigger<\u002Fdiv><div>Who<\u002Fdiv><div>Channel<\u002Fdiv><div>What it says<\u002Fdiv>\n              <\u002Fdiv>\n              <sc-for list=\"{{ notifs }}\" as=\"n\" hint-placeholder-count=\"10\">\n                <div style=\"display:grid;grid-template-columns:1.1fr 1fr .9fr 1.6fr;padding:10px 15px;border-bottom:1px solid #f2f2ef;font-size:11.5px;align-items:start\">\n                  <div style=\"padding-right:10px;font-weight:600;line-height:1.35\">{{ n.trigger }}<\u002Fdiv>\n                  <div style=\"padding-right:10px;color:#44443e;line-height:1.4\">{{ n.who }}<\u002Fdiv>\n                  <div style=\"padding-right:8px\"><span style=\"{{ n.chanCss }}\">{{ n.chan }}<\u002Fspan><\u002Fdiv>\n                  <div style=\"color:#44443e;line-height:1.45\">{{ n.says }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:11px;margin-top:12px\">\n          <sc-for list=\"{{ notifRules }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:12px 13px\">\n              <div style=\"font-size:11.5px;font-weight:700;margin-bottom:4px;color:#c0392b\">{{ r.h }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#44443e;line-height:1.5\">{{ r.p }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border-top:1px solid #e4e4de;padding-top:26px\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:23px;letter-spacing:-.03em;margin-bottom:5px\">How the records relate<\u002Fdiv>\n        <div style=\"font-size:13px;color:#88887e;margin-bottom:16px;max-width:700px;line-height:1.6\">Activity is the spine. Everything else hangs off it by one id. Today jobs write <span style=\"font-family:'DM Mono',monospace;font-size:12px\">RelatedCampaignId<\u002Fspan> from manual submission and nothing from the playbook, so tickets can't navigate home. One indexed <span style=\"font-family:'DM Mono',monospace;font-size:12px\">ParentActivityId<\u002Fspan> replaces it everywhere.<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:11px\">\n          <sc-for list=\"{{ entities }}\" as=\"e\" hint-placeholder-count=\"7\">\n            <div style=\"{{ e.css }}\">\n              <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px\">\n                <div style=\"font-size:13px;font-weight:700\">{{ e.name }}<\u002Fdiv>\n                <div style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#88887e\">{{ e.list }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:11.5px;color:#44443e;line-height:1.6;margin-bottom:8px\">{{ e.desc }}<\u002Fdiv>\n              <div style=\"font-size:10.5px;color:#88887e;padding-top:7px;border-top:1px solid #f2f2ef;font-family:'DM Mono',monospace\">{{ e.rel }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSys }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:28px 30px 60px;max-width:1080px;margin:0 auto;width:100%\">\n      <div style=\"margin-bottom:24px\">\n        <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:4px\">Reference<\u002Fdiv>\n        <div style=\"font-family:'DM Serif Display',serif;font-size:30px;letter-spacing:-.03em;line-height:1.1\">Design system<\u002Fdiv>\n        <div style=\"font-size:13.5px;color:#44443e;margin-top:7px;max-width:680px;line-height:1.6\">Taken from the live Hub, tightened. Same tokens, fewer of them in play at once.<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-bottom:10px\">Palette<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:9px;margin-bottom:28px\">\n        <sc-for list=\"{{ swatches }}\" as=\"s\" hint-placeholder-count=\"12\">\n          <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;overflow:hidden\">\n            <div style=\"{{ s.chip }}\"><\u002Fdiv>\n            <div style=\"padding:8px 10px\">\n              <div style=\"font-size:11.5px;font-weight:600\">{{ s.name }}<\u002Fdiv>\n              <div style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e;margin-top:1px\">{{ s.hex }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-bottom:10px\">Type<\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:20px;margin-bottom:28px;display:flex;flex-direction:column;gap:15px\">\n        <div>\n          <div style=\"font-family:'DM Serif Display',serif;font-size:30px;letter-spacing:-.03em;line-height:1.1\">Page title <em style=\"color:#88887e\">emphasis<\u002Fem><\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:5px\">DM Serif Display · 25px · -.03em<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #f2f2ef;padding-top:15px\">\n          <div style=\"font-size:13px;font-weight:700\">Card heading<\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:5px\">DM Sans · 13px · 700<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #f2f2ef;padding-top:15px\">\n          <div style=\"font-size:12.5px;color:#44443e;line-height:1.6;max-width:560px\">Body copy sits at 12.5px in a dense interface and 13.5px on reference pages. Line height 1.6 either way.<\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:5px\">DM Sans · 12.5px · 400<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #f2f2ef;padding-top:15px\">\n          <div style=\"font-family:'DM Mono',monospace;font-size:24px;font-weight:500;letter-spacing:-.02em\">4,182<\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:5px\">DM Mono · counts, IDs, dates, money<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-top:1px solid #f2f2ef;padding-top:15px\">\n          <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640\">Eyebrow label<\u002Fdiv>\n          <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e;margin-top:5px\">DM Sans · 9.5px · 700 · .11em<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:#88887e;margin-bottom:10px\">Components<\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:11px\">\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:16px\">\n          <div style=\"font-size:11.5px;font-weight:700;margin-bottom:11px\">Buttons<\u002Fdiv>\n          <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n            <button style=\"padding:7px 15px;border:1px solid #0a6640;background:#0a6640;color:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer\">Primary<\u002Fbutton>\n            <button style=\"padding:7px 13px;border:1px solid #e4e4de;background:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#44443e\">Secondary<\u002Fbutton>\n            <button style=\"padding:7px 13px;border:1px solid transparent;background:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#0a6640\">Text<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:16px\">\n          <div style=\"font-size:11.5px;font-weight:700;margin-bottom:11px\">Status pills<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ pills }}\" as=\"p\" hint-placeholder-count=\"6\">\n              <span style=\"{{ p.css }}\">{{ p.label }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:16px\">\n          <div style=\"font-size:11.5px;font-weight:700;margin-bottom:11px\">Venue marks<\u002Fdiv>\n          <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n            <sc-for list=\"{{ venueLegend }}\" as=\"v\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid #e4e4de;border-radius:20px;font-size:11.5px;color:#44443e\">\n                <div style=\"{{ v.dot }}\"><\u002Fdiv>{{ v.name }}\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:16px\">\n          <div style=\"font-size:11.5px;font-weight:700;margin-bottom:11px\">Field<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:4px\">\n            <label style=\"font-size:10px;font-weight:700;color:#44443e;text-transform:uppercase;letter-spacing:.06em\">Venue <span style=\"color:#c0392b\">*<\u002Fspan><\u002Flabel>\n            <sc-raw-select style=\"padding:8px 11px;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:13px;outline:none;background:#fff;color:#0f0f0d\">\n              <option>The Left Bank<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;annotations&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;Full critique&quot;, &quot;Column names only&quot;, &quot;Clean product&quot;],\n    &quot;default&quot;: &quot;Full critique&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Reading mode&quot;,\n    &quot;label&quot;: &quot;Annotations&quot;\n  },\n  &quot;pressure&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;Calm&quot;, &quot;Realistic&quot;, &quot;Under pressure&quot;],\n    &quot;default&quot;: &quot;Realistic&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Sample state&quot;,\n    &quot;label&quot;: &quot;How bad is it&quot;\n  },\n  &quot;venueLens&quot;: {\n    &quot;editor&quot;: &quot;enum&quot;,\n    &quot;options&quot;: [&quot;All venues&quot;, &quot;The Left Bank&quot;, &quot;The Ravenswood&quot;, &quot;Whitfords Brewing Co&quot;, &quot;Hotel Darwin&quot;, &quot;Mustang Bar&quot;],\n    &quot;default&quot;: &quot;All venues&quot;,\n    &quot;tsType&quot;: &quot;string&quot;,\n    &quot;section&quot;: &quot;Sample state&quot;,\n    &quot;label&quot;: &quot;Venue lens&quot;\n  }\n}\">\nconst VENUES = {\n  lb: {name:'The Left Bank', abbr:'LB', c:'#5ba4cf'},\n  rw: {name:'The Ravenswood', abbr:'RW', c:'#1a4a2e'},\n  wbc:{name:'Whitfords Brewing Co', abbr:'WBC', c:'#1a3a6e'},\n  hd: {name:'Hotel Darwin', abbr:'HD', c:'#7b1a2e'},\n  mb: {name:'Mustang Bar', abbr:'MB', c:'#c05c1a'}\n};\n\nconst NAV = [\n  {sec:'Today', items:[\n    {id:'myday', ico:'◐', label:'My Day', badge:'6'},\n    {id:'inbox', ico:'✉', label:'Inbox', badge:'3'}\n  ]},\n  {sec:'Plan', items:[\n    {id:'calendar', ico:'▦', label:'Calendar'},\n    {id:'activities', ico:'◎', label:'Activities'},\n    {id:'board', ico:'◳', label:'Artwork'},\n    {id:'ideas', ico:'✧', label:'Idea Bank'}\n  ]},\n  {sec:'Deliver', items:[\n    {id:'submissions', ico:'✓', label:'Submissions', badge:'4', gold:true},\n    {id:'work', ico:'☰', label:'Projects', badge:'4'},\n    {id:'ticket', ico:'✦', label:'Design Jobs'},\n    {id:'workload', ico:'⣿', label:'Workload'}\n  ]},\n  {sec:'Programs', items:[\n    {id:'loaded', ico:'★', label:'Loaded Rewards'},\n    {id:'ticketing', ico:'⌸', label:'Ticketing'},\n    {id:'specials', ico:'◈', label:'Specials'},\n    {id:'social', ico:'◇', label:'Social'}\n  ]},\n  {sec:'Business', items:[\n    {id:'contacts', ico:'◉', label:'Contacts & Mailing', admin:true},\n    {id:'venues', ico:'⬢', label:'Venues'},\n    {id:'finance', ico:'◧', label:'Finance', finance:true},\n    {id:'operations', ico:'⌘', label:'Operations Map'}\n  ]}\n];\n\nconst TITLES = {\n  myday:'My Work', inbox:'Inbox', calendar:'Activity Calendar', activities:'Activities',\n  ideas:'Idea Bank', submissions:'Submissions', work:'Projects', design:'Design Jobs',\n  workload:'Workload', loaded:'Loaded Rewards', ticketing:'Ticketing', specials:'Specials',\n  social:'Social', contacts:'Contacts & Mailing', venues:'Venues', finance:'Finance', board:'Artwork',\n  operations:'Operations Map', detail:'Sunday Sessions September', submit:'Submit something',\n  ticket:'JOB-241 · Grand Final poster pack'\n};\n\nconst HIDE = {\n  admin: [],\n  management: ['contacts'],\n  design: ['finance','loaded','contacts','specials'],\n  venue: ['loaded','contacts','workload','social','submissions','ticket','operations','specials']\n};\n\nconst ROLE_LABEL = {admin:'Admin', management:'Management', design:'Design', venue:'Venue manager'};\n\nconst PILL = (bg, fg) => `display:inline-flex;align-items:center;padding:2px 9px;border-radius:11px;background:${bg};color:${fg};font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap`;\nconst AV = c => `width:26px;height:26px;border-radius:50%;background:${c};color:#fff;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0`;\nconst DOT = c => `width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0`;\n\nclass Component extends DCLogic {\n  state = {\n    mode: 'map',\n    screen: 'myday',\n    role: 'admin',\n    sub: 0,\n    jobsOff: {},\n    approved: false,\n    jobOwner: {},\n    jobReason: {},\n    approveFail: false,\n    workFilter: 'All',\n    inboxFilter: 'Needs reply',\n    thread: 0,\n    actStage: 'All',\n    actVenue: 'All',\n    actView: 'List',\n    openBuckets: {},\n    picked: [],\n    customBuckets: [{id:'c-thu', name:'Thursday, with Perrin'}],\n    bucketOverride: {},\n    bucketOrder: {},\n    newBucket: '',\n    ptSel: [],\n    ptOpen: {},\n    ptSort: 'My order',\n    ptOrder: [],\n    ptTab: 'My tasks',\n    dStage: 3,\n    regGate: 'All',\n    subStep: 0,\n    f: {title:'Beer of the Month', detail:'Cheeky Monkey pints, $12 all day', venue:'Whitfords Brewing Co',\n        start:'2026-10-01', end:'2026-10-31', type:'Promotion / Offer', format:'', funnel:'Venue Marketing',\n        platform:'', price:'', cap:'', appHeading:'', memberPrice:'', tier:'', posNotes:'', supplierName:'', product:'',\n        other:'', isLoaded:false, posReq:false, supplier:false},\n    promote: {website:true, meta:true, venue:true},\n    artwork: {venue:true, meta:true},\n    tkVals: {},\n    tkSaved: {},\n    tkStamp: 'saved 9:41am',\n    tkPlats: ['In-venue print','Digital screen','Instagram Feed'],\n    tkApprovals: {requester:false},\n    tkRounds: [\n      {n:1, verdict:'Changes requested', who:'Kimberley M.', when:'28 Aug 4:12pm',\n       note:'Date is wrong, it is Sat 26 not Sun 27. Sponsor logo needs to be bottom right.'},\n      {n:2, verdict:'In review', who:'Luca B.', when:'31 Aug 9:40am',\n       note:'Date corrected, sponsor logo added bottom right at 40mm.'}\n    ]\n  };\n\n  go = (screen) => () => this.setState({screen});\n\n  saveField = (key, value) => {\n    this.setState(s => ({\n      tkVals: {...s.tkVals, [key]: value},\n      tkSaved: {...s.tkSaved, [key]: 'saving'}\n    }));\n    clearTimeout(this._tkT && this._tkT[key]);\n    this._tkT = this._tkT || {};\n    this._tkT[key] = setTimeout(() => {\n      const t = new Date();\n      const stamp = 'saved ' + ((t.getHours() % 12) || 12) + ':' + String(t.getMinutes()).padStart(2, '0')\n        + (t.getHours() < 12 ? 'am' : 'pm');\n      this.setState(s => ({tkSaved: {...s.tkSaved, [key]: 'saved'}, tkStamp: stamp}));\n    }, 550);\n  };\n  tabCss(on) {\n    return `padding:5px 13px;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;background:${on?'#fff':'transparent'};color:${on?'#0f0f0d':'rgba(255,255,255,.5)'}`;\n  }\n\n  renderVals() {\n    const {mode, screen, role, sub, jobsOff, approved, workFilter} = this.state;\n    const hidden = HIDE[role] || [];\n    const visible = id => !hidden.includes(id);\n\n    const nav = NAV.map(g => ({\n      sec: g.sec,\n      items: g.items.filter(i => visible(i.id)).map(i => ({\n        ...i,\n        go: this.go(i.id),\n        css: `display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border-radius:7px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;font-size:12.5px;transition:.15s;`\n          + (screen === i.id\n            ? 'background:rgba(255,255,255,.11);color:#fff;font-weight:600'\n            : 'background:transparent;color:rgba(255,255,255,.45);font-weight:500'),\n        badgeCss: `margin-left:auto;font-size:9px;font-weight:700;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center;color:#fff;background:${i.gold ? '#b8860b' : '#0a6640'}`\n      }))\n    })).filter(g => g.items.length);\n\n    const built = ['myday','calendar','submissions','work','contacts','detail','inbox','activities','operations','ticket','submit','finance','board'];\n\n    // ── Tweakable props ──────────────────────────────────────\n    const annotations = this.props.annotations ?? 'Full critique';\n    const showCols  = annotations !== 'Clean product';\n    const showNotes = annotations === 'Full critique';\n    const pressure  = this.props.pressure ?? 'Realistic';\n    const PRESS = {'Calm':0, 'Realistic':1, 'Under pressure':2}[pressure] ?? 1;\n    const lens = this.props.venueLens ?? 'All venues';\n    const LENS_KEY = {'The Left Bank':'lb','The Ravenswood':'rw','Whitfords Brewing Co':'wbc','Hotel Darwin':'hd','Mustang Bar':'mb'}[lens] || null;\n    const inLens = v => !LENS_KEY || v === LENS_KEY;\n    // Under pressure promotes warnings to overdue; Calm demotes them.\n    const press = (late, tone) => PRESS === 2 ? true : PRESS === 0 ? false : late;\n    const col = c => showCols ? c : '';\n\n    // ── Submission form ──────────────────────────────────────\n    const f = this.state.f;\n    const inputCss = `width:100%;box-sizing:border-box;font-family:'DM Sans',sans-serif;font-size:12.5px;padding:8px 10px;border:1px solid #e4e4de;border-radius:7px;background:#fff;color:#0f0f0d;line-height:1.5;resize:vertical`;\n    const dateCss = inputCss.replace(\"'DM Sans',sans-serif\", \"'DM Mono',monospace\");\n    const opts = arr => arr.map(v => (typeof v === 'string' ? {v, label: v} : v));\n\n    const SUB_STEPS = [\n      {label:'The activity', hint:'What and when'},\n      {label:'How it works', hint:'Mechanics'},\n      {label:'What you need', hint:'Promotion and artwork'},\n      {label:'Review', hint:'Check and send'}\n    ];\n    const step = this.state.subStep;\n    const subSteps = SUB_STEPS.map((s, i) => ({\n      label: s.label, hint: s.hint, num: i + 1,\n      go: () => this.setState({subStep: i}),\n      css: `flex:1 1 148px;min-width:0;display:flex;align-items:center;gap:9px;padding:11px 12px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s;`\n        + (i === step ? 'background:#fff;' : 'background:#fbfbf9;')\n        + (i ? 'border-left:1px solid #e4e4de;' : ''),\n      numCss: `width:21px;height:21px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:10.5px;font-weight:700;`\n        + (i === step ? 'background:#0a6640;color:#fff' : i < step ? 'background:#e8f5ee;color:#0a6640' : 'background:#f2f2ef;color:#a8a89e')\n    }));\n\n    const setF = k => e => this.setState(s => ({f: {...s.f, [k]: e.target.value}}));\n    const mk = (label, key, o = {}) => ({\n      label, col: col(o.col || ''), req: !!o.req, help: o.help || '',\n      val: f[key] || '', ph: o.ph || '',\n      set: setF(key),\n      options: o.options ? opts(o.options) : [],\n      isArea: o.kind === 'area', isSelect: o.kind === 'select', isDate: o.kind === 'date',\n      isText: !o.kind || o.kind === 'text',\n      css: o.kind === 'date' ? dateCss : inputCss,\n      rowCss: `padding:0 0 13px;${o.half ? '' : ''}`\n    });\n\n    const subTemplates = ['Beer of the Month','Live music night','Members offer','Start from scratch'].map(name => ({\n      name,\n      pick: () => this.setState(s => ({\n        f: name === 'Beer of the Month'\n          ? {...s.f, title:'Beer of the Month', type:'Promotion / Offer', funnel:'Venue Marketing', detail:'Cheeky Monkey pints'}\n          : name === 'Live music night'\n          ? {...s.f, title:'Live music night', type:'Event', format:'Live Music / Entertainment', funnel:'Events Program'}\n          : name === 'Members offer'\n          ? {...s.f, title:'Members offer', type:'Promotion / Offer', funnel:'Loaded Rewards', isLoaded:true}\n          : {title:'', detail:'', venue:'', start:'', end:'', type:'', format:'', funnel:'', platform:'', price:'', cap:'', posNotes:'', isLoaded:false, posReq:false, supplier:false}\n      })),\n      css: `padding:5px 11px;border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;transition:.15s;`\n        + (f.title === name ? 'background:#0f120f;color:#fff;border:1px solid #0f120f' : 'background:#fff;color:#44443e;border:1px solid #e4e4de')\n    }));\n\n    const subFields1 = [\n      mk('Activity name', 'title', {col:'Title', req:true, ph:'e.g. Beer of the Month', help:'The repeatable promotion or event name. The month comes from the start date.'}),\n      mk('What is it exactly', 'detail', {col:'Description', kind:'area', ph:'e.g. Cheeky Monkey pints, $12 all day'}),\n      mk('Venue', 'venue', {col:'Venue', req:true, kind:'select', options:[{v:'',label:'Select…'},'The Left Bank','The Ravenswood','Whitfords Brewing Co','Hotel Darwin','Mustang Bar','All Venues']}),\n      mk('Activity type', 'type', {col:'ActivityType', req:true, kind:'select', options:[{v:'',label:'Select…'},'Event','Promotion / Offer','Campaign']}),\n      ...(f.type === 'Event' ? [mk('Event format', 'format', {col:'EventFormat', kind:'select', options:[{v:'',label:'Select…'},'Ticketed Event','Table Booking Event','Non-Ticketed Event','Live Music / Entertainment','Sporting Screening','Community Event','Private / Functions Event','Recurring Event']})] : []),\n      mk('Starts', 'start', {col:'Start', req:true, kind:'date'}),\n      mk('Ends', 'end', {col:'End', kind:'date', help:'Leave blank for a single day.'}),\n      mk('Who owns the marketing spend', 'funnel', {col:'BusinessStream', kind:'select', options:[{v:'',label:'Select…'},'Venue Marketing','Loaded Rewards','Functions','Gift Cards','Events Program','Group / Brand Marketing']})\n    ];\n\n    const toggleF = k => () => this.setState(s => ({f: {...s.f, [k]: !s.f[k]}}));\n    const boxCss = on => `width:18px;height:18px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;margin-top:1px;background:${on ? '#0a6640' : '#fff'};border:1.5px solid ${on ? '#0a6640' : '#d0d0c8'}`;\n    const wrapCss = on => `background:${on ? '#fbfbf9' : '#fff'};border:1px solid ${on ? '#c8e5d6' : '#e4e4de'};border-radius:9px;padding:13px 14px;margin-bottom:9px;transition:.15s`;\n    const isTicketed = f.format === 'Ticketed Event';\n    const subToggles = [\n      ...(isTicketed ? [{\n        label:'Ticketing', hint:'Your event format is Ticketed, so these are required.', open:true, forced:true,\n        toggle: () => {}, tick:'✓', on:true,\n        fields:[\n          mk('Platform','platform',{col:'TicketPlatform', kind:'select', options:[{v:'',label:'Select…'},'Humanitix','TryBooking','Eventbrite','Oztix','Now Book It','Other']}),\n          mk('Price','price',{col:'TicketPrice', ph:'25.00'}),\n          mk('Capacity','cap',{col:'Capacity', ph:'220'})\n        ]\n      }] : []),\n      {\n        label:'This is a Loaded Rewards offer', hint:'Members see it in the app. Adds the app tile and member pricing.',\n        on: f.isLoaded, toggle: toggleF('isLoaded'), tick: f.isLoaded ? '✓' : '',\n        fields:[\n          mk('App heading','appHeading',{col:'AppHeading', ph:'e.g. Half price sirloin, save $24'}),\n          mk('Member price','memberPrice',{col:'LoadedBasePrice', ph:'16.00'}),\n          mk('Tier','tier',{col:'LoadedTier', kind:'select', options:[{v:'',label:'All members'},'Tier 2 and above','Tier 3 only']})\n        ]\n      },\n      {\n        label:'POS setup mbined only\n    // in this interface. Personal Tasks are Kimberley's own private SharePoint\n    // list; Shared Work Items are the group delivery system, assigned or\n    // generated from Activity workflow. They are never merged into one list.\n    const PROJECTS = [\n      {id:'sep26', name:'September 2026', kind:'Monthly plan', owner:'Kimberley M.'},\n      {id:'xmas26', name:'Christmas 2026', kind:'Campaign', owner:'Kimberley M.'},\n      {id:'hdweb', name:'New Website, Hotel Darwin', kind:'Body of work', owner:'Kimberley M.'},\n      {id:'gf26', name:'Grand Final 2026', kind:'Campaign', owner:'Kimberley M.'}\n    ];\n    const PROJ_NAME = Object.fromEntries(PROJECTS.map(p => [p.id, p.name]));\n\n    // Source is recorded, not inferred, so a generated item can never be mistaken\n    // for one someone chose to raise.\n    const SRC = {\n      manual:   ['#f2f2ef', '#44443e', 'Manual'],\n      assigned: ['#eaf0f8', '#1a4fa0', 'Assigned'],\n      stage:    ['#f0eaf8', '#6b3fa0', 'Stage-generated'],\n      comment:  ['#fdf3ec', '#c05c1a', 'From a comment']\n    };\n    const PRI = {High:['#fdf0ee','#c0392b'], Medium:['#fdf6e3','#b8860b'], Low:['#f2f2ef','#88887e']};\n\n    const vName = k => k ? VENUES[k].name : 'Group';\n    const TASKS = [\n      ...mine.map(b => ({b:0, title: b.title, v: b.v, venue: vName(b.v), meta: b.meta.split(' · ').slice(-1)[0],\n        blocking: b.jobs ? 'blocks ' + b.jobs + (b.jobs === 1 ? ' job' : ' jobs') : '', act:'Decide', to:'detail'})),\n      ...toSignOff.map(b => ({b:1, title: b.title, v: b.v, venue: vName(b.v), meta:'Luca · print Friday', blocking:'print run', act:'Review', to:'ticket'})),\n      {b:1, title:'September EDM banner — round 2', v:'lb', venue:'The Left Bank', meta:'Luca, waiting since Fri', act:'Review', to:'ticket'},\n      {b:1, title:'Grand Final poster pack', v:'mb', venue:'Mustang Bar', meta:'Luca, waiting since Sat', act:'Review', to:'ticket'},\n      {b:2, title:'Triage 4 submissions', v:null, venue:'All ve ity, drag order, optional Project and Activity links. Not created for\n    // other users; other roles see Shared Work Items only.\n    const PERSONAL_RAW = [\n      {id:'p1', title:'Draft the Christmas trading hours note', pri:'High', due:'2 Sep', seq:1, proj:'xmas26', act:null,\n       subs:[{t:'Confirm kitchen close times with each venue', done:true}, {t:'Check public holiday surcharge wording', done:false}, {t:'Send to Perrin for the tills', done:false}]},\n      {id:'p2', title:'Call the Humanitix rep about fee caps', pri:'Medium', due:'3 Sep', seq:2, proj:'gf26', act:'Grand Final ticket on-sale', subs:[]},\n      {id:'p3', title:'Write the photography brief for Darwin', pri:'High', due:'5 Sep', seq:3, proj:'hdweb', act:null,\n       subs:[{t:'Pull reference shots from the old site', done:true}, {t:'Shot list, room by room', done:false}]},\n      {id:'p4', title:'Book the Oktoberfest stein supplier', pri:'Medium', due:'8 Sep', seq:4, proj:'sep26', act:'Whitfords Oktoberfest', subs:[]},\n      {id:'p5', title:'Tidy the shared drive naming', pri:'Low', due:null, seq:5, proj:null, act:null,\n       subs:[{t:'Agree a convention with Luca', done:false}, {t:'Rename 2025 folders', done:false}, {t:'Write it into the handbook', done:false}]},\n      {id:'p6', title:'Chase the Ravenswood liquor licence renewal', pri:'High', due:'29 Aug', seq:6, proj:null, act:null, overdue:true, subs:[]}\n    ];\n    // Five standard buckets are structural: each names a kind of action, they are\n    // what stops the page becoming a flat list, and they cannot be deleted or\n    // renamed. Anything the user adds is their own filing, and fully theirs.\n    const persOrder = this.state.ptOrder && this.state.ptOrder.length ? this.state.ptOrder : PERSONAL_RAW.map(p => p.id);\n    const PERSONAL = [...PERSONAL_RAW]\n      .sort((a, b) => persOrder.indexOf(a.id) - persOrder.indexOf(b.id))\n      .map(p => ({\n        ...p, kind:'personal', src:'manual', status: 'Open', v: null, venue:'Private' ;\n        const on = ptSel.includes(id);\n        const sub = t.subs || [];\n        const doneN = sub.filter(x => x.done).length;\n        const isOpen = !!ptOpen[id];\n        const sc = SRC[t.src], pc = t.pri ? PRI[t.pri] : null;\n        return {\n          id, title: t.title, isPersonal: t.kind === 'personal', isShared: t.kind !== 'personal',\n          ref: t.kind === 'personal' ? 'Personal' : t.wid,\n          refCss: PILL(t.kind === 'personal' ? '#efece6' : '#eef2f6', t.kind === 'personal' ? '#7a6a4f' : '#41556b'),\n          srcLabel: sc[2], srcCss: PILL(sc[0], sc[1]),\n          pri: t.pri || 'None', priCss: PILL(pc ? pc[0] : '#f7f7f5', pc ? pc[1] : '#a8a89e'),\n          status: t.status, due: t.due || '—',\n          dueCss: `font-family:'DM Mono',monospace;font-size:10.5px;white-space:nowrap;color:${t.overdue ? '#c0392b' : '#88887e'};font-weight:${t.overdue ? 700 : 400}`,\n          projName: t.proj ? PROJ_NAME[t.proj] : 'Unassigned',\n          projCss: `font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:${t.proj ? '#44443e' : '#a8a89e'}`,\n          activity: t.activity || '', hasActivity: !!t.activity,\n          hasSubs: sub.length > 0,\n          subLabel: doneN + '/' + sub.length + ' subtasks',\n          subChev: isOpen ? '▾' : '▸',\n          subs: sub.map(x => ({\n            t: x.t, mark: x.done ? '✓' : '',\n            boxCss: `width:14px;height:14px;border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:${x.done ? '#0a6640' : '#fff'};border:1.5px solid ${x.done ? '#0a6640' : '#d0d0c8'}`,\n            txtCss: `font-size:11.5px;line-height:1.35;${x.done ? 'color:#a8a89e;text-decoration:line-through' : 'color:#44443e'}`\n          })),\n          toggleSub: () => this.setState(st => ({ptOpen: {...st.ptOpen, [id]: !isOpen}})),\n          sel: () => this.setState(st => ({ptSel: (st.ptSel || []).includes(id) ? st.ptSel.filter(x => x !== id) : [...(st.ptSel || []), id]})),\n          selMark: on ? '✓' : '',\n          selCss: `width:16px;height:16px;border-radius:4px;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;background:${on ? '#0a6640' : '#fff'};border:1.5px solid ${on ? '#0a6640' : '#d0d0c8'}`,\n          rowCss: `display:flex;align-items:flex-start;gap:9px;padding:9px 13px;border-bottom:1px solid #f2f2ef;background:${on ? '#f4faf6' : t.kind === 'personal' ? '#fdfcfa' : '#fff'};border-left:3px solid ${t.kind === 'personal' ? '#c8b89a' : 'transparent'}`,\n          canDrag: t.kind === 'personal',\n          open: this.go(t.to || 'detail')\n        };\n      });\n\n    const ptTabs = ['Today', 'All work'].map(l => ({\n      label: l, pick: () => this.setState({ptTab: l}),\n      css: `padding:9px 3px;margin-right:18px;background:none;border:none;border-bottom:2px solid ${ptTab === l ? '#0a6640' : 'transparent'};font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;color:${ptTab === l ? '#0f0f0d' : '#88887e'}`\n    }));\n    const ptWhenChips = ['All', 'Today', 'Upcoming', 'Overdue'].map(l => ({label: l, pick: () => this.setState({ptWhen: l}), css: chip2(ptWhen === l)}));\n    const ptKindChips = ['All', 'Personal', 'Shared'].map(l => ({label: l, pick: () => this.setState({ptKind: l}), css: chip2(ptKind === l)}));\n    const mkSel = (val, key, opts) => ({\n      value: val, css: selCss,\n      change: e => this.setState({[key]: e.target.value}),\n      opts: opts.map(o => ({v: o[0], l: o[1]}))\n    });\n    const ptProjSel = mkSel(ptProj, 'ptProj', [['All','Every project'], ...PROJECTS.map(p => [p.id, p.name])]);\n    const ptVenSel = mkSel(ptVen, 'ptVen', [['All','Every venue'], ...Object.keys(VENUES).map(k => [k, VENUES[k].name])]);\n    const ptPriSel = mkSel(ptPri, 'ptPri', [['All','Any priority'], ['High','High'], ['Medium','Medium'], ['Low','Low']]);\n    const ptStatusSel = mkSel(ptStatus, 'ptStatus', [['All','Any status'], ['Open','Open'], ['In progress','In progress'], ['In review','In review'], ['Waiting','Waiting']]);\n\n    const ptStateBtns = [['normal','Normal'], ['empty','Empty'], ['saving','Saving'], ['failed','Save failed'], ['noconfig','List not connected']]\n      .map(([v, l]) => ({label: l, pick: () => this.setState({ptState: v}), css: chip2(ptState === v)}));\n\n    const ptBulk = ['Set priority', 'Mark done', 'Move under a parent', 'Delete'].map(l => ({\n      label: l,\n      css: `padding:6px 11px;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;cursor:pointer;white-space:nowrap;`\n        + (l === 'Delete' ? 'background:#fff;color:#c0392b;border:1px solid #f0d5d0' : 'background:#fff;color:#44443e;border:1px solid #e4e4de')\n    }));\n\n    const ptStats = [\n      {n: String(ALL_TASKS.filter(t => t.overdue).length), l:'Overdue', tone:'#c0392b'},\n      {n: String(SHARED.length), l:'Shared items assigned to you', tone:'#0f0f0d'},\n      {n: String(PERSONAL.length), l:'Personal tasks', tone:'#0f0f0d'},\n      {n: String(ALL_TASKS.filter(t => !t.proj).length), l:'Not in a project', tone:'#b8860b'}\n    ].map(x => ({...x, numCss: `font-family:'DM Mono',monospace;font-size:19px;font-weight:600;letter-spacing:-.02em;color:${x.tone}`}));\n\n    const STD_BUCKETS = [\n      {id:'unblock', name:'Only you can unblock this', why:'Decisions other people are waiting on. Smallest list, biggest effect.', tone:'#c05c1a', mark:'!'},\n      {id:'signoff', name:'Sign off', why:'Work that is finished and waiting on your yes. Do these in one sitting.', tone:'#6b3fa0', mark:'✓'},\n      {id:'make', name:'Yours to make', why:'Actual work only you can produce. Protect time for it.', tone:'#0a6640', mark:'✎'},\n      {id:'waiting', name:'Waiting on someone else', why:'Not yours to do. Nudge or reassign — do not absorb it.', tone:'#88887e', mark:'⋯'},\n      {id:'later', name:'Not today', why:'Real, dated, and deliberately out of view until closer.', tone:'#a8a89e', mark:'·'}\n    ];\n    const STD_IDS = STD_BUCKETS.map(b => b.id);\n    const customB = this.state.customBuckets || [];\n    const ALL_BUCKETS = [...STD_BUCKETS, ...customB.map(c => ({...c, why:'Your bucket. Drag work in — nothing arrives here on its own.', tone:'#44443e', mark:'◇', custom:true}))];\n\n    // Every task has a derived bucket from its own data. A drag writes an\n    // override on top of it; the derived value is never lost, so clearing the\n    // override sends the task back to where the data says it belongs.\n    const tid = t => t.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 34);\n    const ovr = this.state.bucketOverride || {};\n    const seq = this.state.bucketOrder || {};\n    const tasksById = {};\n    ALL_TASKS.forEach(t => { tasksById[tid(t)] = t; });\n    const bucketOf = t => {\n      const o = ovr[tid(t)];\n      return o && ALL_BUCKETS.some(b => b.id === o) ? o : STD_IDS[t.b];\n    };\n    const openB = this.state.openBuckets;\n    const pickedIds = this.state.picked;\n    const dragId = this.state.dragTask;\n    const dragOver = this.state.dragOver;\n\n    const moveTo = (id, bucket, beforeId) => this.setState(s => {\n      const order = {...(s.bucketOrder || {})};\n      Object.keys(order).forEach(k => { order[k] = order[k].filter(x => x !== id); });\n      const cur = order[bucket] ? [...order[bucket]] : ALL_TASKS.filter(t => bucketOf(t) === bucket).map(tid).filter(x => x !== id);\n      const at = beforeId ? cur.indexOf(beforeId) : -1;\n      if (at >= 0) cur.splice(at, 0, id); else cur.push(id);\n      order[bucket] = cur;\n      return {bucketOrder: order, bucketOverride: {...(s.bucketOverride || {}), [id]: bucket}, dragTask: null, dragOver: null};\n    });\n\n    const buckets = ALL_BUCKETS.map((b, bi) => {\n      let items = ALL_TASKS.filter(t => bucketOf(t) === b.id);\n      const order = seq[b.id];\n      if (order) items = [...items].sort((x, y) => {\n        const p = order.indexOf(tid(x)), q = order.indexOf(tid(y));\n        return (p < 0 ? 999 : p) - (q < 0 ? 999 : q);\n      });\n      const isOpen = openB[b.id] !== undefined ? openB[b.id] : bi < 3 || !!b.custom;\n      const hot = dragOver === b.id;\n      return {\n        id: b.id, name: b.name, why: b.why, count: items.length, open: isOpen, chev: isOpen ? '▾' : '▸',\n        isCustom: !!b.custom, isEmpty: !items.length,\n        toggle: () => this.setState(s => ({openBuckets: {...s.openBuckets, [b.id]: !isOpen}})),\n        remove: () => this.setState(s => ({\n          customBuckets: (s.customBuckets || []).filter(c => c.id !== b.id),\n          bucketOverride: Object.fromEntries(Object.entries(s.bucketOverride || {}).filter(([, v]) => v !== b.id))\n        })),\n        mark: b.mark,\n        onDragOver: e => { e.preventDefault(); if (dragOver !== b.id) this.setState({dragOver: b.id}); },\n        onDrop: e => { e.preventDefault(); if (dragId) moveTo(dragId, b.id, null); },\n        wrapCss: `background:#fff;border:1px solid ${hot ? '#0a6640' : b.id === 'unblock' ? '#e8c9a0' : '#e4e4de'};border-radius:11px;overflow:hidden;transition:border-color .12s;box-shadow:${hot ? '0 0 0 3px rgba(10,102,64,.09)' : 'none'}`,\n        headCss: `flex:1;display:flex;align-items:center;gap:11px;padding:12px 15px;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;min-width:0`,\n        headWrapCss: `display:flex;align-items:center;background:${b.id === 'unblock' ? '#fdf9f2' : '#fff'};padding-right:8px`,\n        markCss: `width:20px;height:20px;border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:${b.tone}`,\n        emptyCss: `padding:15px;border-top:1px dashed ${hot ? '#0a6640' : '#e4e4de'};font-size:11px;color:${hot ? '#0a6640' : '#a8a89e'};text-align:center`,\n        items: items.map(t => {\n          const id = tid(t);\n          const on = pickedIds.includes(id);\n
