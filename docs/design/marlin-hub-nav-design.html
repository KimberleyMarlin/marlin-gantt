<body>
  <div id="__bundler_placeholder">Loading Bundled Page...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

lor:#0a6640;text-decoration:none}\na:hover{color:#0d8050}\n::-webkit-scrollbar{width:9px;height:9px}\n::-webkit-scrollbar-thumb{background:#d0d0c8;border-radius:9px}\n::-webkit-scrollbar-track{background:transparent}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family:'DM Sans',sans-serif;color:#0f0f0d;background:#f7f7f5;min-height:100vh;display:flex;flex-direction:column\">\n\n  <div style=\"display:flex;align-items:center;gap:18px;padding:0 18px;height:46px;background:#0f120f;color:#fff;flex-shrink:0;position:sticky;top:0;z-index:60\">\n    <div style=\"display:flex;align-items:center;gap:10px\">\n      <img src=\"d414866a-e842-4e79-8b73-d748a512fcb8\" alt=\"Marlin\" style=\"height:26px;width:auto;max-width:130px;object-fit:contain;display:block\">\n      <span style=\"font-size:9px;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,255,255,.35)\">Hospitality OS<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:2px;background:rgba(255,255,255,.06);padding:3px;border-radius:8px\">\n      <button sc-camel-on-click=\"{{ goMap }}\" style=\"{{ tabMap }}\">Map<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goHub }}\" style=\"{{ tabHub }}\">Prototype<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSys }}\" style=\"{{ tabSys }}\">System<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div style=\"display:flex;align-items:center;gap:8px;font-size:11px;color:rgba(255,255,255,.4)\">\n      <span style=\"text-transform:uppercase;letter-spacing:.1em;font-size:9px\">Viewing as<\u002Fspan>\n      <sc-raw-select value=\"{{ role }}\" sc-camel-on-change=\"{{ setRole }}\" style=\"background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#fff;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;padding:4px 8px;border-radius:6px;outline:none\">\n        <option value=\"admin\" style=\"color:#0f0f0d\">Admin<\u002Foption>\n        <option value=\"management\" style=\"color:#0f0f0d\">Management<\u002Foption>\n        <option value=\"design\" style=\"color:#0f0f0d\">Design<\u002Foption>\n        <option value=\"venue\" style=\"color:#0f0f0d\">Venue manager<\u002Foption>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ isHub }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display:flex;flex:1;min-height:0\">\n\n    <div style=\"width:228px;flex-shrink:0;background:#0f120f;display:flex;flex-direction:column;position:sticky;top:46px;height:calc(100vh - 46px)\">\n      <div style=\"padding:14px 12px 10px;border-bottom:1px solid rgba(255,255,255,.07)\">\n        <button sc-camel-on-click=\"{{ goSubmit }}\" style=\"width:100%;padding:9px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px\" style-hover=\"background:#0d8050\">\n          <span style=\"font-size:14px;line-height:1\">＋<\u002Fspan>Submit something\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div style=\"flex:1;overflow-y:auto;padding:8px 8px 16px;display:flex;flex-direction:column;gap:1px\">\n        <sc-for list=\"{{ nav }}\" as=\"group\" hint-placeholder-count=\"5\">\n          <div style=\"padding:11px 10px 3px;font-size:9px;font-weight:700;color:rgba(255,255,255,.22);text-transform:uppercase;letter-spacing:.12em\">{{ group.sec }}<\u002Fdiv>\n          <sc-for list=\"{{ group.items }}\" as=\"item\" hint-placeholder-count=\"4\">\n            <button sc-camel-on-click=\"{{ item.go }}\" style=\"{{ item.css }}\">\n              <span style=\"width:16px;text-align:center;flex-shrink:0;font-size:12px;opacity:.75\">{{ item.ico }}<\u002Fspan>\n              <span style=\"flex:1;text-align:left\">{{ item.label }}<\u002Fspan>\n              <sc-if value=\"{{ item.badge }}\" hint-placeholder-val=\"{{ true }}\">\n                <span style=\"{{ item.badgeCss }}\">{{ item.badge }}<\u002Fspan>\n              <\u002Fsc-if>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"padding:10px 12px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;gap:8px\">\n        <div style=\"width:26px;height:26px;border-radius:50%;background:#0a6640;color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0\">KM<\u002Fdiv>\n        <div style=\"min-width:0;flex:1\">\n          <div style=\"font-size:11.5px;font-weight:600;color:rgba(255,255,255,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Kimberley Marlin<\u002Fdiv>\n          <div style=\"font-size:9.5px;color:rgba(255,255,255,.32);text-transform:uppercase;letter-spacing:.08em\">{{ roleLabel }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1;min-width:0;display:flex;flex-direction:column\">\n      <div style=\"height:44px;background:#fff;border-bottom:1px solid #e4e4de;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:46px;z-index:40;flex-shrink:0\">\n        <div style=\"font-family:'DM Serif Display',serif;font-size:15.5px;letter-spacing:-.02em;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ screenTitle }}<\u002Fdiv>\n        <div style=\"position:relative\">\n          <input placeholder=\"Search activities, jobs, people\" style=\"padding:5px 10px 5px 26px;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none;background:#f2f2ef;width:210px\" style-focus=\"border-color:#0a6640;background:#fff\">\n          <span style=\"position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#88887e;font-size:12px;pointer-events:none\">⌕<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:11px;color:#88887e;font-weight:500;white-space:nowrap\">Mon 31 Aug<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex:1;min-width:0;padding:20px 22px 40px\">\n\n        <sc-if value=\"{{ isMyDay }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:1180px\">\n            <div style=\"margin-bottom:16px\">\n              <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Monday, 31 August<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Good morning, <em style=\"color:#88887e\">Kimberley<\u002Fem><\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">{{ mydayBlurb }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;align-items:center;border-bottom:1px solid #e4e4de;margin-bottom:16px\">\n              <sc-for list=\"{{ ptTabs }}\" as=\"t\" hint-placeholder-count=\"2\">\n                <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.css }}\">{{ t.label }}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <sc-if value=\"{{ ptIsToday }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px;align-items:stretch\">\n              <div style=\"flex:1 1 340px;min-width:0;background:#0f120f;border-radius:11px;padding:15px 17px;color:#fff\">\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:rgba(255,255,255,.4);margin-bottom:9px\">If you do nothing today<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:7px\">\n                  <sc-for list=\"{{ costs }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div style=\"display:flex;align-items:baseline;gap:10px\">\n                      <div style=\"font-family:'DM Mono',monospace;font-size:19px;line-height:1;letter-spacing:-.02em;color:{{ c.tone }};min-width:22px\">{{ c.n }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:rgba(255,255,255,.72);line-height:1.4\">{{ c.what }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 300px;min-width:0;background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:15px 17px\">\n                <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;flex-wrap:wrap\">\n                  <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:#0a6640\">Today, three things<\u002Fdiv>\n                  <div style=\"font-family:'DM Mono',monospace;font-size:10.5px;color:#88887e\">{{ pickedLabel }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px;color:#88887e;line-height:1.5;margin-bottom:10px\">Everything else is explicitly not today. Pick from any bucket below.<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:6px\">\n                  <sc-for list=\"{{ picked }}\" as=\"p\" hint-placeholder-count=\"3\">\n                    <div style=\"{{ p.css }}\">\n                      <div style=\"{{ p.numCss }}\">{{ p.n }}<\u002Fdiv>\n                      <div style=\"flex:1;min-width:0;font-size:12px;line-height:1.35;{{ p.textCss }}\">{{ p.title }}<\u002Fdiv>\n                      <sc-if value=\"{{ p.filled }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ p.clear }}\" style=\"background:none;border:none;cursor:pointer;color:#a8a89e;font-size:14px;line-height:1;padding:0 2px;flex-shrink:0\" style-hover=\"color:#c0392b\">×<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n              <div style=\"flex:1 1 440px;min-width:0;display:flex;flex-direction:column;gap:12px\">\n                <div style=\"display:flex;align-items:center;gap:8px;padding:0 2px 2px\">\n                  <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.4\">Drag any task between buckets. Drop on a task to place it above that one.<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ buckets }}\" as=\"b\" hint-placeholder-count=\"5\">\n                  <div style=\"{{ b.wrapCss }}\" sc-camel-on-drag-over=\"{{ b.onDragOver }}\" sc-camel-on-drop=\"{{ b.onDrop }}\">\n                    <div style=\"{{ b.headWrapCss }}\">\n                      <button sc-camel-on-click=\"{{ b.toggle }}\" style=\"{{ b.headCss }}\">\n                        <div style=\"{{ b.markCss }}\">{{ b.mark }}<\u002Fdiv>\n                        <div style=\"min-width:0;flex:1;text-align:left\">\n                          <div style=\"font-size:13px;font-weight:700;line-height:1.25\">{{ b.name }}<\u002Fdiv>\n                          <div style=\"font-size:11px;color:#88887e;margin-top:2px;line-height:1.4\">{{ b.why }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"font-family:'DM Mono',monospace;font-size:12px;color:#88887e;flex-shrink:0\">{{ b.count }}<\u002Fdiv>\n                        <div style=\"font-size:10px;color:#a8a89e;flex-shrink:0;width:10px;text-align:center\">{{ b.chev }}<\u002Fdiv>\n                      <\u002Fbutton>\n                      <sc-if value=\"{{ b.isCustom }}\" hint-placeholder-val=\"{{ false }}\">\n                        <button sc-camel-on-click=\"{{ b.remove }}\" title=\"Remove this bucket\" style=\"background:none;border:none;cursor:pointer;color:#a8a89e;font-size:15px;line-height:1;padding:4px 6px;flex-shrink:0\" style-hover=\"color:#c0392b\">×<\u002Fbutton>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ b.open }}\" hint-placeholder-val=\"{{ true }}\">\n                      <div>\n                        <sc-for list=\"{{ b.items }}\" as=\"t\" hint-placeholder-count=\"3\">\n                          <div style=\"{{ t.rowCss }}\" draggable=\"true\" sc-camel-on-drag-start=\"{{ t.onDragStart }}\" sc-camel-on-drag-end=\"{{ t.onDragEnd }}\" sc-camel-on-drag-over=\"{{ t.onDragOver }}\" sc-camel-on-drop=\"{{ t.onDrop }}\">\n                            <div style=\"color:#d0d0c8;font-size:11px;line-height:1.4;cursor:grab;flex-shrink:0;margin-top:1px;letter-spacing:-1px\" title=\"Drag to move\">⠿<\u002Fdiv>\n                            <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.pickCss }}\" title=\"Do this today\">{{ t.pickMark }}<\u002Fbutton>\n                            <div sc-camel-on-click=\"{{ t.go }}\" style=\"flex:1;min-width:0;cursor:pointer\">\n                              <div style=\"font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:2px\">{{ t.title }}<\u002Fdiv>\n                              <div style=\"font-size:10.5px;color:#88887e;display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n                                <span style=\"{{ t.kindCss }}\">{{ t.kindLabel }}<\u002Fspan>\n                                <span style=\"{{ t.srcCss }}\">{{ t.srcLabel }}<\u002Fspan>\n                                <span>{{ t.venue }}<\u002Fspan><span>·<\u002Fspan><span>{{ t.meta }}<\u002Fspan>\n                                <sc-if value=\"{{ t.blocking }}\" hint-placeholder-val=\"{{ false }}\">\n                                  <span style=\"color:#c05c1a;font-weight:700\">{{ t.blocking }}<\u002Fspan>\n                                <\u002Fsc-if>\n                              <\u002Fdiv>\n                              <sc-if value=\"{{ t.moved }}\" hint-placeholder-val=\"{{ false }}\">\n                                <div style=\"display:flex;align-items:center;gap:7px;margin-top:4px\">\n                                  <span style=\"font-size:10px;color:#c05c1a\">{{ t.movedFrom }}<\u002Fspan>\n                                  <button sc-camel-on-click=\"{{ t.unmove }}\" style=\"background:none;border:none;padding:0;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:700;color:#0a6640;cursor:pointer\">Put it back<\u002Fbutton>\n                                <\u002Fdiv>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                            <div style=\"display:flex;align-items:center;gap:6px;flex-shrink:0\">\n                              <sc-if value=\"{{ t.effort }}\" hint-placeholder-val=\"{{ false }}\">\n                                <span style=\"font-family:'DM Mono',monospace;font-size:10px;color:#a8a89e;white-space:nowrap\">{{ t.effort }}<\u002Fspan>\n                              <\u002Fsc-if>\n                              <button style=\"{{ t.actCss }}\">{{ t.act }}<\u002Fbutton>\n                            <\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                        <sc-if value=\"{{ b.isEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div style=\"{{ b.emptyCss }}\">Drop a task here<\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n\n                <div style=\"display:flex;gap:7px;align-items:center;background:#fff;border:1px dashed #d0d0c8;border-radius:11px;padding:10px 12px\">\n                  <input value=\"{{ newBucket }}\" sc-camel-on-change=\"{{ setNewBucket }}\" placeholder=\"Name a bucket of your own — Thursday, With Perrin, Quick wins\" style=\"flex:1;min-width:0;padding:7px 10px;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;outline:none;color:#0f0f0d\">\n                  <button sc-camel-on-click=\"{{ addBucket }}\" style=\"padding:7px 13px;background:#0f120f;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap\">Add bucket<\u002Fbutton>\n                <\u002Fdiv>\n                <div style=\"font-size:10.5px;color:#a8a89e;line-height:1.45;padding:0 2px\">The five buckets above are fixed — they are the shape of the page, and tasks land in them from their own data. Your buckets sit underneath and hold whatever you drag in.<\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:14px\">\n                <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                  <div style=\"padding:11px 15px;border-bottom:1px solid #e4e4de;font-size:13px;font-weight:700\">Going live next<\u002Fdiv>\n                  <sc-for list=\"{{ upcoming }}\" as=\"u\" hint-placeholder-count=\"4\">\n                    <div style=\"display:flex;gap:11px;padding:11px 15px;border-bottom:1px solid #f2f2ef;align-items:center\">\n                      <div style=\"{{ u.barCss }}\"><\u002Fdiv>\n                      <div style=\"flex:1;min-width:0\">\n                        <div style=\"font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">{{ u.title }}<\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e\">{{ u.venue }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#44443e;white-space:nowrap\">{{ u.when }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"background:#e8f5ee;border:1px solid #c8e5d6;border-radius:11px;padding:14px 15px\">\n                  <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#0a6640;margin-bottom:5px\">Soft spots in the calendar<\u002Fdiv>\n                  <div style=\"font-size:12.5px;color:#44443e;line-height:1.55\">Mustang Bar has nothing scheduled 8–21 Sep. Hotel Darwin has no Loaded offer running this month — Loaded now shows as a calendar layer, so gaps like that are visible instead of living in a separate screen.<\u002Fdiv>\n                  <button sc-camel-on-click=\"{{ goCalendar }}\" style=\"margin-top:10px;font-size:11.5px;font-weight:700;color:#0a6640;background:none;border:none;padding:0;cursor:pointer;font-family:'DM Sans',sans-serif\">Open calendar →<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <\u002Fsc-if>\n\n            <sc-if value=\"{{ ptIsAll }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px\">\n                <sc-for list=\"{{ ptStats }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:10px;padding:12px 15px\">\n                    <div style=\"{{ s.numCss }}\">{{ s.n }}<\u002Fdiv>\n                    <div style=\"font-size:11px;color:#44443e;margin-top:2px;line-height:1.35\">{{ s.l }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:12px\">\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap;align-items:center\">\n                  <sc-for list=\"{{ ptWhenChips }}\" as=\"c\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                  <div style=\"width:1px;height:18px;background:#e4e4de;margin:0 3px\"><\u002Fdiv>\n                  <sc-for list=\"{{ ptKindChips }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <button sc-camel-on-click=\"{{ c.pick }}\" style=\"{{ c.css }}\">{{ c.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                  <sc-raw-select value=\"{{ ptProjSel.value }}\" sc-camel-on-change=\"{{ ptProjSel.change }}\" style=\"{{ ptProjSel.css }}\">\n                    <sc-for list=\"{{ ptProjSel.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <sc-raw-select value=\"{{ ptVenSel.value }}\" sc-camel-on-change=\"{{ ptVenSel.change }}\" style=\"{{ ptVenSel.css }}\">\n                    <sc-for list=\"{{ ptVenSel.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <sc-raw-select value=\"{{ ptPriSel.value }}\" sc-camel-on-change=\"{{ ptPriSel.change }}\" style=\"{{ ptPriSel.css }}\">\n                    <sc-for list=\"{{ ptPriSel.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                  <sc-raw-select value=\"{{ ptStatusSel.value }}\" sc-camel-on-change=\"{{ ptStatusSel.change }}\" style=\"{{ ptStatusSel.css }}\">\n                    <sc-for list=\"{{ ptStatusSel.opts }}\" as=\"o\" hint-placeholder-count=\"4\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                  <\u002Fsc-raw-select>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ ptNoConfig }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"background:#fff;border:1px solid #f0e2b8;border-radius:11px;padding:18px 20px;margin-bottom:12px\">\n                  <div style=\"font-size:13px;font-weight:700;margin-bottom:4px\">Personal Tasks list is not connected<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.55;margin-bottom:12px;max-width:560px;text-wrap:pretty\">Shared Work Items are showing normally. Your private list has not been pointed at a SharePoint list yet, so nothing personal can load. Nobody else is affected — this list belongs to your account only.<\u002Fdiv>\n                  <button style=\"padding:8px 14px;background:#0a6640;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer\">Choose the list<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ ptFailed }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:10px;background:#fdf0ee;border:1px solid #f0d5d0;border-radius:9px;padding:10px 13px;margin-bottom:12px\">\n                  <span style=\"font-size:13px;color:#c0392b\">⚠<\u002Fspan>\n                  <span style=\"font-size:11.5px;color:#44443e;line-height:1.45;flex:1\">Could not save the new order. Your change is still on screen but not in SharePoint — the list may be checked out, or you may have lost connection.<\u002Fspan>\n                  <button style=\"padding:5px 11px;background:#fff;border:1px solid #e4e4de;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap\">Try again<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ ptHasSel }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:flex;align-items:center;gap:9px;background:#0f120f;border-radius:9px;padding:9px 13px;margin-bottom:10px;flex-wrap:wrap\">\n                  <span style=\"font-family:'DM Mono',monospace;font-size:11.5px;color:#fff\">{{ ptSelLabel }}<\u002Fspan>\n                  <div style=\"flex:1\"><\u002Fdiv>\n                  <sc-for list=\"{{ ptBulk }}\" as=\"b\" hint-placeholder-count=\"4\">\n                    <button style=\"{{ b.css }}\">{{ b.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                  <button sc-camel-on-click=\"{{ ptClearSel }}\" style=\"background:none;border:none;color:rgba(255,255,255,.5);font-size:11.5px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif\">Clear<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"display:flex;align-items:center;gap:9px;padding:8px 13px;background:#fbfbf9;border-bottom:1px solid #e4e4de;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#88887e\">\n                  <div style=\"width:16px\"><\u002Fdiv>\n                  <div style=\"flex:1\">Work<\u002Fdiv>\n                  <div style=\"width:96px\">Project<\u002Fdiv>\n                  <div style=\"width:66px\">Priority<\u002Fdiv>\n                  <div style=\"width:74px\">Status<\u002Fdiv>\n                  <div style=\"width:52px;text-align:right\">Due<\u002Fdiv>\n                <\u002Fdiv>\n                <sc-for list=\"{{ workRows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                  <div>\n                    <div style=\"{{ r.rowCss }}\">\n                      <button sc-camel-on-click=\"{{ r.sel }}\" style=\"{{ r.selCss }}\">{{ r.selMark }}<\u002Fbutton>\n                      <div style=\"flex:1;min-width:0\">\n                        <div sc-camel-on-click=\"{{ r.open }}\" style=\"font-size:12.5px;font-weight:600;line-height:1.35;cursor:pointer\">{{ r.title }}<\u002Fdiv>\n                        <div style=\"display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px\">\n                          <span style=\"{{ r.refCss }}\">{{ r.ref }}<\u002Fspan>\n                          <span style=\"{{ r.srcCss }}\">{{ r.srcLabel }}<\u002Fspan>\n                          <sc-if value=\"{{ r.hasActivity }}\" hint-placeholder-val=\"{{ false }}\">\n                            <span style=\"font-size:10.5px;color:#88887e\">◎ {{ r.activity }}<\u002Fspan>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ r.hasSubs }}\" hint-placeholder-val=\"{{ false }}\">\n                            <button sc-camel-on-click=\"{{ r.toggleSub }}\" style=\"background:none;border:none;padding:0;font-family:'DM Sans',sans-serif;font-size:10.5px;font-weight:700;color:#0a6640;cursor:pointer\">{{ r.subChev }} {{ r.subLabel }}<\u002Fbutton>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"{{ r.projCss }}\" title=\"{{ r.projName }}\">{{ r.projName }}<\u002Fdiv>\n                      <div style=\"width:66px;flex-shrink:0\"><span style=\"{{ r.priCss }}\">{{ r.pri }}<\u002Fspan><\u002Fdiv>\n                      <div style=\"width:74px;flex-shrink:0;font-size:11px;color:#44443e\">{{ r.status }}<\u002Fdiv>\n                      <div style=\"width:52px;flex-shrink:0;text-align:right\"><span style=\"{{ r.dueCss }}\">{{ r.due }}<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ r.subsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"padding:2px 13px 10px 41px;display:flex;flex-direction:column;gap:6px;background:#fdfcfa;border-bottom:1px solid #f2f2ef\">\n                        <sc-for list=\"{{ r.subs }}\" as=\"x\" hint-placeholder-count=\"2\">\n                          <div style=\"display:flex;align-items:flex-start;gap:8px\">\n                            <div style=\"{{ x.boxCss }}\">{{ x.mark }}<\u002Fdiv>\n                            <div style=\"{{ x.txtCss }}\">{{ x.t }}<\u002Fdiv>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n                <sc-if value=\"{{ ptEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:34px 20px;text-align:center\">\n                    <div style=\"font-size:18px;color:#d0d0c8;margin-bottom:7px\">◇<\u002Fdiv>\n                    <div style=\"font-size:12.5px;font-weight:600;margin-bottom:3px\">Nothing matches those filters<\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;margin-bottom:12px\">You have work, it just is not in this slice.<\u002Fdiv>\n                    <button sc-camel-on-click=\"{{ ptResetFilters }}\" style=\"padding:7px 13px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:#44443e;cursor:pointer\">Clear filters<\u002Fbutton>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ ptLoading }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"padding:30px 20px;text-align:center;font-size:11.5px;color:#88887e\">Loading your work from SharePoint…<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:12px;flex-wrap:wrap;margin-top:14px\">\n                <div style=\"flex:1;min-width:270px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px\">\n                  <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">Two sources, one view<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;text-wrap:pretty\">The warm stripe and Personal tag mark your own private list. Everything else is a Shared Work Item from an activity workflow. They are combined here and nowhere else — separate lists, separate permissions, and a personal task is never visible to anyone but you.<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:270px;background:#fbfbf9;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px\">\n                  <div style=\"font-size:12px;font-weight:700;margin-bottom:4px\">Priority is not risk<\u002Fdiv>\n                  <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;text-wrap:pretty\">High, Medium, Low and none are yours to set. Overdue and At Risk are calculated from due dates, blockers and workflow stage, so nobody can mark their own work safe by changing a label.<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <div style=\"margin-top:16px;padding-top:14px;border-top:1px solid #e4e4de\">\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#a8a89e;margin-bottom:7px\">Preview states<\u002Fdiv>\n                <div style=\"display:flex;gap:6px;flex-wrap:wrap\">\n                  <sc-for list=\"{{ ptStateBtns }}\" as=\"b\" hint-placeholder-count=\"5\">\n                    <button sc-camel-on-click=\"{{ b.pick }}\" style=\"{{ b.css }}\">{{ b.label }}<\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSubmissions }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"margin-bottom:14px\">\n              <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Triage<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Submissions<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">Approving creates the jobs. Nothing moves to Planning until every job is assigned.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:minmax(240px,300px) minmax(0,1fr);gap:14px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:10px 14px;border-bottom:1px solid #e4e4de;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#88887e\">In intake · 4<\u002Fdiv>\n                <sc-for list=\"{{ submissions }}\" as=\"s\" hint-placeholder-count=\"4\">\n                  <div sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.css }}\">\n                    <div style=\"font-size:12.5px;font-weight:600;margin-bottom:2px\">{{ s.title }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e\">{{ s.venue }} · {{ s.when }}<\u002Fdiv>\n                    <div style=\"font-size:10.5px;color:#88887e;margin-top:3px\">from {{ s.by }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                <div style=\"padding:14px 18px;border-bottom:1px solid #e4e4de\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap\">\n                    <div style=\"flex:1 1 260px;min-width:0\">\n                      <div style=\"font-family:'DM Serif Display',serif;font-size:19px;letter-spacing:-.02em\">{{ sub.title }}<\u002Fdiv>\n                      <div style=\"font-size:12px;color:#88887e;margin-top:2px\">{{ sub.venue }} · {{ sub.when }} · submitted by {{ sub.by }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                      <button style=\"padding:7px 13px;border:1px solid #e4e4de;background:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#44443e;white-space:nowrap\" style-hover=\"background:#f2f2ef\">Send back<\u002Fbutton>\n                      <button sc-camel-on-click=\"{{ approve }}\" style=\"padding:7px 15px;border:1px solid #0a6640;background:#0a6640;color:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap\" style-hover=\"background:#0d8050\">{{ approveLabel }}<\u002Fbutton>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:12px;align-items:center\">\n                    <sc-for list=\"{{ stages }}\" as=\"st\" hint-placeholder-count=\"5\">\n                      <div style=\"{{ st.css }}\">{{ st.label }}<\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"display:flex;flex-wrap:wrap;gap:0\">\n                  <div style=\"flex:1 1 330px;min-width:0;padding:16px 18px;border-right:1px solid #e4e4de\">\n                    <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:10px\">What was submitted<\u002Fdiv>\n                    <sc-for list=\"{{ subFields }}\" as=\"f\" hint-placeholder-count=\"8\">\n                      <div style=\"display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #f2f2ef;font-size:12.5px\">\n                        <div style=\"width:118px;flex-shrink:0;color:#88887e\">{{ f.k }}<\u002Fdiv>\n                        <div style=\"flex:1;font-weight:500;color:#0f0f0d\">{{ f.v }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n\n                  <div style=\"flex:1 1 330px;min-width:0;padding:16px 18px;background:#fbfbf9;border-top:1px solid #e4e4de\">\n                    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#0a6640;white-space:nowrap\">Jobs this will create<\u002Fdiv>\n                      <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e;white-space:nowrap\">{{ jobCount }} selected<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size:11.5px;color:#88887e;line-height:1.5;margin-bottom:12px\">Derived from the answers on the left. Switch off what is not needed and say why. Everything that stays needs a named owner.<\u002Fdiv>\n                    <sc-for list=\"{{ proposedJobs }}\" as=\"j\" hint-placeholder-count=\"5\">\n                      <div style=\"{{ j.css }}\">\n                        <div sc-camel-on-click=\"{{ j.toggle }}\" style=\"{{ j.boxCss }}\">{{ j.tick }}<\u002Fdiv>\n                        <div style=\"flex:1;min-width:0\">\n                          <div style=\"font-size:12.5px;font-weight:600;margin-bottom:1px\">{{ j.title }}<\u002Fdiv>\n                          <div style=\"font-size:10.5px;color:#88887e;margin-bottom:6px\">{{ j.detail }}<\u002Fdiv>\n                          <sc-if value=\"{{ j.included }}\" hint-placeholder-val=\"{{ true }}\">\n                            <div style=\"display:flex;align-items:center;gap:7px;flex-wrap:wrap\">\n                              <span style=\"font-size:10px;color:#a8a89e\">Owner<\u002Fspan>\n                              <sc-raw-select value=\"{{ j.owner }}\" sc-camel-on-change=\"{{ j.setOwner }}\" style=\"{{ j.ownerCss }}\">\n                                <sc-for list=\"{{ j.ownerOpts }}\" as=\"o\" hint-placeholder-count=\"5\"><option value=\"{{ o.v }}\">{{ o.l }}<\u002Foption><\u002Fsc-for>\n                              <\u002Fsc-raw-select>\n                              <span style=\"font-family:'DM Mono',monospace;font-size:10px;color:#88887e\">due {{ j.due }}<\u002Fspan>\n                              <sc-if value=\"{{ j.noOwner }}\" hint-placeholder-val=\"{{ false }}\">\n                                <span style=\"font-size:10px;color:#c0392b;font-weight:700\">Needs an owner<\u002Fspan>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ j.off }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div>\n                              <div style=\"font-size:10px;color:#c05c1a;font-weight:700;margin-bottom:4px\">Skipped — say why, it is stored on the activity<\u002Fdiv>\n                              <input value=\"{{ j.reason }}\" sc-camel-on-change=\"{{ j.setReason }}\" placeholder=\"e.g. Venue is printing this in-house\" style=\"{{ j.reasonCss }}\">\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n\n                    <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid #e4e4de\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:3px\">What Approve writes<\u002Fdiv>\n                      <div style=\"font-size:11px;color:#88887e;line-height:1.5;margin-bottom:9px\">One unit of work. If any line fails, none of it stands and the activity stays in Intake.<\u002Fdiv>\n                      <div style=\"display:flex;flex-direction:column;gap:5px\">\n                        <sc-for list=\"{{ writePlan }}\" as=\"w\" hint-placeholder-count=\"4\">\n                          <div style=\"display:flex;align-items:baseline;gap:9px;font-size:11.5px\">\n                            <span style=\"font-family:'DM Mono',monospace;font-size:11.5px;font-weight:600;color:#0a6640;min-width:16px\">{{ w.n }}<\u002Fspan>\n                            <span style=\"flex:1;color:#44443e;line-height:1.4\">{{ w.what }}<\u002Fspan>\n                            <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0;white-space:nowrap\">{{ w.col }}<\u002Fspan>\n                          <\u002Fdiv>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <sc-if value=\"{{ hasBlockers }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:11px;padding:10px 12px;background:#fdf6e3;border:1px solid #f0e2b8;border-radius:9px\">\n                        <div style=\"font-size:11px;font-weight:700;color:#8a6410;margin-bottom:5px\">Approve is held until<\u002Fdiv>\n                        <div style=\"display:flex;flex-direction:column;gap:4px\">\n                          <sc-for list=\"{{ approveBlockers }}\" as=\"b\" hint-placeholder-count=\"2\">\n                            <div style=\"font-size:11px;color:#44443e;line-height:1.45\">{{ b.t }}<\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ approveOk }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:12px;padding:12px 13px;background:#e8f5ee;border:1px solid #c8e5d6;border-radius:9px\">\n                        <div style=\"font-size:12px;color:#0a6640;line-height:1.5;margin-bottom:7px\"><strong>{{ jobCount }} work items created and linked.<\u002Fstrong> Folder created, {{ ownerN }} owners notified, activity advanced to Planning.<\u002Fdiv>\n                        <div style=\"font-size:11px;color:#44443e;line-height:1.5\">Re-running this will not create them again. Stage-generated work is keyed on activity and stage, so re-entering a stage finds what already exists instead of duplicating it.<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <sc-if value=\"{{ approveBad }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:12px;padding:12px 13px;background:#fdf0ee;border:1px solid #f0d5d0;border-radius:9px\">\n                        <div style=\"font-size:12px;color:#c0392b;line-height:1.5;margin-bottom:7px\"><strong>Nothing was written.<\u002Fstrong> The third work item was rejected by SharePoint, so the first two were rolled back, no owner was emailed, and the activity is still in Intake.<\u002Fdiv>\n                        <div style=\"font-size:11px;color:#44443e;line-height:1.5;margin-bottom:9px\">Your selections and owners are exactly as you left them. Nobody has been told this activity is approved, because it is not.<\u002Fdiv>\n                        <button sc-camel-on-click=\"{{ resetApprove }}\" style=\"padding:6px 12px;background:#fff;border:1px solid #e4e4de;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;color:#44443e;cursor:pointer\">Back to the preview<\u002Fbutton>\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n\n                    <div style=\"margin-top:11px;display:flex;align-items:center;gap:8px;flex-wrap:wrap\">\n                      <span style=\"font-size:10px;color:#a8a89e\">Prototype<\u002Fspan>\n                      <button sc-camel-on-click=\"{{ toggleFail }}\" style=\"{{ failToggleCss }}\">Simulate a failed write<\u002Fbutton>\n                    <\u002Fdiv>\n                    <sc-if value=\"{{ approved }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:12px;padding:11px 13px;background:#e8f5ee;border:1px solid #c8e5d6;border-radius:9px;font-size:12px;color:#0a6640;line-height:1.5\">\n                        <strong>{{ jobCount }} jobs created and linked<\u002Fstrong> to this activity. Owners notified. Activity advanced to Planning.\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isWork }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Delivery<\u002Fdiv>\n                <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Work register<\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">Every job ticket, whoever raised it. Each one links back to its activity.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:5px;flex-wrap:wrap\">\n                <sc-for list=\"{{ workFilters }}\" as=\"f\" hint-placeholder-count=\"5\">\n                  <button sc-camel-on-click=\"{{ f.go }}\" style=\"{{ f.css }}\">{{ f.label }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:start\">\n              <sc-for list=\"{{ board }}\" as=\"col\" hint-placeholder-count=\"3\">\n                <div style=\"background:#f2f2ef;border:1px solid #e4e4de;border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:8px\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:center;padding:2px 4px\">\n                    <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#44443e\">{{ col.name }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e\">{{ col.count }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <sc-for list=\"{{ col.cards }}\" as=\"c\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ c.go }}\" style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:11px 12px;cursor:pointer\" style-hover=\"border-color:#d0d0c8;box-shadow:0 2px 8px rgba(0,0,0,.05)\">\n                      <div style=\"display:flex;justify-content:space-between;gap:8px;margin-bottom:6px\">\n                        <div style=\"{{ c.typeCss }}\">{{ c.type }}<\u002Fdiv>\n                        <div style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#88887e\">{{ c.id }}<\u002Fdiv>\n                      <\u002Fdiv>\n                      <div style=\"font-size:12.5px;font-weight:600;line-height:1.35;margin-bottom:6px\">{{ c.title }}<\u002Fdiv>\n                      <div style=\"display:flex;align-items:center;gap:7px;font-size:10.5px;color:#88887e\">\n                        <div style=\"{{ c.venueDot }}\"><\u002Fdiv>\n                        <span>{{ c.venue }}<\u002Fspan>\n                      <\u002Fdiv>\n                      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:9px;padding-top:8px;border-top:1px solid #f2f2ef\">\n                        <div style=\"display:flex;align-items:center;gap:6px\">\n                          <div style=\"{{ c.avCss }}\">{{ c.initials }}<\u002Fdiv>\n                          <span style=\"font-size:10.5px;color:#44443e;font-weight:500\">{{ c.owner }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"{{ c.dueCss }}\">{{ c.due }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isContacts }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"max-width:1220px\">\n            <div style=\"display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:14px;flex-wrap:wrap\">\n              <div>\n                <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Customer data<\u002Fdiv>\n                <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Contacts <em style=\"color:#88887e\">&amp; mailing<\u002Fem><\u002Fdiv>\n                <div style=\"font-size:12.5px;color:#88887e;margin-top:3px\">One person, every venue they belong to, and what they've consented to.<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:7px;flex-wrap:wrap\">\n                <button style=\"padding:7px 13px;border:1px solid #e4e4de;background:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;color:#44443e;white-space:nowrap\" style-hover=\"background:#f2f2ef\">Export segment<\u002Fbutton>\n                <button style=\"padding:7px 13px;border:1px solid #0a6640;background:#0a6640;color:#fff;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap\" style-hover=\"background:#0d8050\">＋ Contact<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid;grid-template-columns:200px 1fr;gap:14px;align-items:start\">\n              <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:14px\">\n                <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:9px\">Venue<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:2px;margin-bottom:16px\">\n                  <sc-for list=\"{{ venueFilters }}\" as=\"v\" hint-placeholder-count=\"6\">\n                    <button sc-camel-on-click=\"{{ v.go }}\" style=\"{{ v.css }}\">\n                      <div sty :#44443e;line-height:1.4\">{{ o.blocks }}<\u002Fdiv>\n                          <div style=\"{{ o.dueCss }}\">{{ o.due }}<\u002Fdiv>\n                          <div><span style=\"{{ o.pillCss }}\">{{ o.state }}<\u002Fspan><\u002Fdiv>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"display:flex;flex-wrap:wrap\">\n                <div style=\"flex:1 1 380px;min-width:0;padding:18px 20px;border-right:1px solid #e4e4de\">\n                  <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:11px\">Details<\u002Fdiv>\n                  <sc-for list=\"{{ detailFields }}\" as=\"f\" hint-placeholder-count=\"9\">\n                    <div style=\"display:flex;gap:14px;padding:7px 0;border-bottom:1px solid #f2f2ef;font-size:12.5px\">\n                      <div style=\"width:135px;flex-shrink:0;color:#88887e\">{{ f.k }}<\u002Fdiv>\n                      <div style=\"flex:1;font-weight:500\">{{ f.v }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n                <div style=\"flex:1 1 300px;min-width:0;padding:18px 20px;background:#fbfbf9;border-top:1px solid #e4e4de\">\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:11px\">\n                    <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;white-space:nowrap\">{{ jobPanelTitle }}<\u002Fdiv>\n                    <div style=\"font-family:'DM Mono',monospace;font-size:11px;color:#88887e;white-space:nowrap\">{{ jobCountLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:flex;flex-direction:column;gap:7px\">\n                    <sc-for list=\"{{ linkedJobs }}\" as=\"j\" hint-placeholder-count=\"4\">\n                      <div sc-camel-on-click=\"{{ j.go }}\" style=\"background:#fff;border:1px solid #e4e4de;border-radius:9px;padding:10px 11px;cursor:pointer\" style-hover=\"border-color:#0a6640\">\n                        <div style=\"display:flex;justify-content:space-between;gap:8px;margin-bottom:4px\">\n                          <div style=\"font-size:12px;font-weight:600\">{{ j.title }}<\u002Fdiv>\n                          <div style=\"{{ j.pillCss }}\">{{ j.status }}<\u002Fdiv>\n                        <\u002Fdiv>\n                        <div style=\"font-size:10.5px;color:#88887e\">{{ j.owner }} · due {{ j.due }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isSubmit }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"max-width:1180px\">\n            <div style=\"margin-bottom:16px\">\n              <div style=\"font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:#0a6640;margin-bottom:3px\">Intake<\u002Fdiv>\n              <div style=\"font-family:'DM Serif Display',serif;font-size:25px;letter-spacing:-.03em;line-height:1.1\">Submit an activity<\u002Fdiv>\n              <div style=\"font-size:12.5px;color:#88887e;margin-top:3px;max-width:680px;line-height:1.55;text-wrap:pretty\">{{ submitBlurb }}<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start\">\n              <div style=\"flex:1 1 480px;min-width:0\">\n                <div style=\"display:flex;flex-wrap:wrap;gap:0;margin-bottom:12px;background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                  <sc-for list=\"{{ subSteps }}\" as=\"s\" hint-placeholder-count=\"4\">\n                    <button sc-camel-on-click=\"{{ s.go }}\" style=\"{{ s.css }}\">\n                      <div style=\"{{ s.numCss }}\">{{ s.num }}<\u002Fdiv>\n                      <div style=\"text-align:left;min-width:0\">\n                        <div style=\"font-size:11.5px;font-weight:600;line-height:1.25\">{{ s.label }}<\u002Fdiv>\n                        <div style=\"font-size:10px;color:#88887e;line-height:1.3\">{{ s.hint }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fbutton>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n\n                <div style=\"background:#fff;border:1px solid #e4e4de;border-radius:11px;overflow:hidden\">\n                  <sc-if value=\"{{ subIs1 }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"padding:17px 20px\">\n                      <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#88887e;margin-bottom:4px\">Start from a template<\u002Fdiv>\n                      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px\">\n                        <sc-for list=\"{{ subTemplates }}\" as=\"t\" hint-placeholder-count=\"4\">\n                          <button sc-camel-on-click=\"{{ t.pick }}\" style=\"{{ t.css }}\">{{ t.name }}<\u002Fbutton>\n                        <\u002Fsc-for>\n                      <\u002Fdiv>\n                      <sc-for list=\"{{ subFields1 }}\" as=\"f\" hint-placeholder-count=\"6\">\n                        <div style=\"{{ f.rowCss }}\">\n                          <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:4px\">\n                            <span style=\"font-size:11px;font-weight:600;color:#44443e\">{{ f.label }}<\u002Fspan>\n                            <sc-if value=\"{{ f.req }}\" hint-placeholder-val=\"{{ false }}\">\n                              <span style=\"color:#c0392b;font-size:11px\">*<\u002Fspan>\n                            <\u002Fsc-if>\n                            <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">{{ f.col }}<\u002Fspan>\n                          <\u002Fdiv>\n                          <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                            <textarea value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" rows=\"2\" style=\"{{ f.css }}\"><\u002Ftextarea>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n                            <sc-raw-select value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"{{ f.css }}\">\n                              <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                                <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n                              <\u002Fsc-for>\n                            <\u002Fsc-raw-select>\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.isDate }}\" hint-placeholder-val=\"{{ false }}\">\n                            <input type=\"date\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"{{ f.css }}\">\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                            <input type=\"text\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" style=\"{{ f.css }}\">\n                          <\u002Fsc-if>\n                          <sc-if value=\"{{ f.help }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"font-size:10.5px;color:#88887e;margin-top:3px;line-height:1.45\">{{ f.help }}<\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ subIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:17px 20px\">\n                      <div style=\"font-size:12.5px;color:#88887e;margin-bottom:14px;line-height:1.55\">Only what your answers on step one make relevant. {{ subStep2Note }}<\u002Fdiv>\n                      <sc-for list=\"{{ subToggles }}\" as=\"t\" hint-placeholder-count=\"3\">\n                        <div style=\"{{ t.wrapCss }}\">\n                          <button sc-camel-on-click=\"{{ t.toggle }}\" style=\"display:flex;align-items:flex-start;gap:10px;width:100%;background:none;border:none;padding:0;cursor:pointer;text-align:left;font-family:'DM Sans',sans-serif\">\n                            <div style=\"{{ t.boxCss }}\">{{ t.tick }}<\u002Fdiv>\n                            <div style=\"min-width:0;flex:1\">\n                              <div style=\"font-size:12.5px;font-weight:600;color:#0f0f0d\">{{ t.label }}<\u002Fdiv>\n                              <div style=\"font-size:11px;color:#88887e;margin-top:2px;line-height:1.45\">{{ t.hint }}<\u002Fdiv>\n                            <\u002Fdiv>\n                          <\u002Fbutton>\n                          <sc-if value=\"{{ t.open }}\" hint-placeholder-val=\"{{ false }}\">\n                            <div style=\"margin-top:11px;padding-top:11px;border-top:1px solid #e8f5ee;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px\">\n                              <sc-for list=\"{{ t.fields }}\" as=\"f\" hint-placeholder-count=\"3\">\n                                <div>\n                                  <div style=\"display:flex;align-items:center;gap:7px;margin-bottom:4px\">\n                                    <span style=\"font-size:11px;font-weight:600;color:#44443e\">{{ f.label }}<\u002Fspan>\n                                    <span style=\"font-family:'DM Mono',monospace;font-size:9.5px;color:#b8b8b0\">{{ f.col }}<\u002Fspan>\n                                  <\u002Fdiv>\n                                  <sc-if value=\"{{ f.isSelect }}\" hint-placeholder-val=\"{{ false }}\">\n                                    <sc-raw-select value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" style=\"{{ f.css }}\">\n                                      <sc-for list=\"{{ f.options }}\" as=\"o\" hint-placeholder-count=\"4\">\n                                        <option value=\"{{ o.v }}\">{{ o.label }}<\u002Foption>\n                                      <\u002Fsc-for>\n                                    <\u002Fsc-raw-select>\n                                  <\u002Fsc-if>\n                                  <sc-if value=\"{{ f.isArea }}\" hint-placeholder-val=\"{{ false }}\">\n                                    <textarea value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" rows=\"2\" style=\"{{ f.css }}\"><\u002Ftextarea>\n                                  <\u002Fsc-if>\n                                  <sc-if value=\"{{ f.isText }}\" hint-placeholder-val=\"{{ true }}\">\n                                    <input type=\"text\" value=\"{{ f.val }}\" sc-camel-on-change=\"{{ f.set }}\" placeholder=\"{{ f.ph }}\" style=\"{{ f.css }}\">\n                                  <\u002Fsc-if>\n                                <\u002Fdiv>\n                              <\u002Fsc-for>\n                            <\u002Fdiv>\n                          <\u002Fsc-if>\n                        <\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n\n                  <sc-if value=\"{{ subIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"padding:17px 20px\">\n                      <sc-if value=\"{{ showNotes }}\" hint-placeholder-val=\"{{ true }}\">\n                        <div style=\"font-size:12.5px;color:#44443e;margin-bottom:4px;line-height:1.55;max-width:600px;text-wrap:pretty\">Two se
