lel. Design, web, paid, POS and ticketing progress independently, each with its own due date and rounds. No job waits on another unless a real dependency exists.',\n       gate:'Every job reaches its own review state. Ticketing needs confirmed capacity, not artwork.',\n       notify:'Only on change: a blocked job, a missed due date, or a round returned. Progress alone is silent.'},\n      {n:5, name:'Review', spCol:'Review', owner:'marketing',\n       what:'Each deliverable is signed off by marketing, who wrote the brief. Request changes increments the round and sends the job back with a note. The venue is told the outcome, not asked for it.',\n       gate:'Sign-off on every job. Final file marked and linked, live URLs recorded.',\n       notify:'Marketing when a final file is marked. Luca or Didier when changes are requested, with the note.'},\n      {n:6, name:'Live', spCol:'Live', owner:'marketing',\n       what:'The activity is publicly live. Ticket sales, bookings and campaign results start flowing back against the activity.',\n       gate:'All jobs closed. Nothing outstanding on the activity record.',\n       notify:'Venue and submitter told it is live, with the links. Ops confirms in-venue material is up.'},\n      {n:7, name:'Done', spCol:'Done', owner:'marketing',\n       what:'After the end date, the activity closes with its result. Attendance or sales, spend against budget, and a short wrap note from the venue.',\n       gate:'Result recorded. Without it the activity closes with no learning attached.',\n       notify:'Venue asked for the wrap note once. Marketing lead gets the monthly roll-up.'}\n    ].map(s => ({\n      ...s,\n      rowCss: 'background:#fff;border:1px solid #e4e4de;border-radius:11px;padding:14px 16px',\n      numCss: `width:24px;height:24px;border-radius:50%;background:#0f120f;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:11px;font-weight:700;flex-shrink:0`,\n      stagePill: PILL('#f2f2ef', '#44443e')\n    }));\n\n    const GATE_TONE = {\n      'Submission':['#e8f5ee','#0a6640'], 'Triage':['#eaf0f8','#1a4fa0'], 'Before design':['#f0eaf8','#6b3fa0'],\n      'Before build':['#fdf3e0','#8a6410'], 'Before go-live':['#fdeee4','#c05c1a'], 'At close':['#f2f2ef','#44443e']\n    };\n    const REGISTER = [\n      {field:'Activity name', col:'Title', gate:'Submission', who:'Submitter', blocks:'Nothing can be created without it'},\n      {field:'Venue', col:'Venue', gate:'Submission', who:'Submitter', blocks:'Venue approval routing and all reporting'},\n      {field:'Start and end date', col:'Start, End', gate:'Submission', who:'Submitter', blocks:'Every due date is calculated backwards from the start'},\n      {field:'Activity type and format', col:'ActivityType, EventFormat', gate:'Submission', who:'Submitter', blocks:'Decides whether ticketing is needed at all'},\n      {field:'What it is exactly', col:'Description', gate:'Submission', who:'Submitter', blocks:'Triage cannot judge the request without it'},\n      {field:'Promote where', col:'Channels', gate:'Submission', who:'Submitter', blocks:'Which delivery jobs get raised'},\n      {field:'Artwork where', col:'AssetsNeeded', gate:'Submission', who:'Submitter', blocks:'Whether a design job exists'},\n      {field:'Staff and internal assets', col:'AssetsNeeded', gate:'Submission', who:'Submitter', blocks:'Internal comms artwork, currently an option nobody sees'},\n      {field:'Who owns the spend', col:'BusinessStream', gate:'Triage', who:'Marketing', blocks:'Budget attribution and Loaded eligibility'},\n      {field:'Job owners and due dates', col:'AssignedTo, DueDate', gate:'Triage', who:'Marketing', blocks:'Approval cannot complete until every job has both', isNew:true},\n      {field:'Marketing lead time', col:'Marketingleadtime', gate:'Triage', who:'Marketing', blocks:'Calculates the design brief due date'},\n      {field:'Priority', col:'Priority', gate:'Triage', who:'Marketing', blocks:'Currently hardcoded to High on every brief'},\n      {field:'Supplier and product', col:'SupplierLookupId, ProductLookupId', gate:'Triage', who:'Marketing', blocks:'Co-funding claims and supplier reporting'},\n      {field:'Brand and department', col:'Brand, Departement', gate:'Triage', who:'Marketing', blocks:'Loaded filtering, which v16 had to work around'},\n      {field:'Job folder', col:'JobFolderURL', gate:'Triage', who:'Marketing', blocks:'Designer has nowhere to put working files'},\n      {field:'Copy to include', col:'CopyText', gate:'Before design', who:'Brief author', blocks:'Designer cannot start. Only a boolean is stored today', isNew:true},\n      {field:'Key message and tone', col:'KeyMessage', gate:'Before design', who:'Brief author', blocks:'Designer guesses, which causes round two', isNew:true},\n      {field:'Dimensions and specs', col:'AssetSpec', gate:'Before design', who:'Brief author', blocks:'Wrong size artwork'},\n      {field:'TV sizes and orientation', col:'AssetTVsDetail', gate:'Before design', who:'Brief author', blocks:'Screen artwork for the wrong aspect'},\n      {field:'Newsletter requirements', col:'AssetNewsletterDetail', gate:'Before design', who:'Brief author', blocks:'EDM header and tile sizing'},\n      {field:'Reference and inspiration', col:'ReferenceURL', gate:'Before design', who:'Brief author', blocks:'Optional, but reduces rounds', isNew:true},\n      {field:'Artwork due back', col:'ArtworkDueDate', gate:'Before design', who:'Marketing', blocks:'Collected by the current form and discarded', isNew:true},\n      {field:'Customer-facing long copy', col:'LongDescription', gate:'Before build', who:'Submitter or marketing', blocks:'Website listing, app tile and any public listing'},\n      {field:'Ticket platform, price, capacity', col:'TicketPlatform, TicketPrice, Capacity', gate:'Before build', who:'Marketing', blocks:'Ticketing job cannot be set up'},\n      {field:'Ticket link', col:'TicketURL', gate:'Before build', who:'Whoever set up ticketing', blocks:'Website listing and paid media landing page'},\n      {field:'RRP and member price', col:'RegularPrice, LoadedBasePrice', gate:'Before build', who:'Perrin', blocks:'POS pricing and the app saving figure'},\n      {field:'App heading and short description', col:'AppHeading, AppShortDescription', gate:'Before build', who:'Amelia', blocks:'App tile cannot be built'},\n      {field:'App copy override', col:'AppDescription', gate:'Before build', who:'Marketing', blocks:'Optional. Falls back to long description'},\n      {field:'Booking link', col:'BookingURL', gate:'Before build', who:'Marketing', blocks:'App tile and any booking call to action'},\n      {field:'Loaded offer structure', col:'Offer Variants', gate:'Before build', who:'Amelia', blocks:'Redemption mechanics at the till'},\n      {field:'In app and in newsletter', col:'AppRequired, NewsletterRequired', gate:'Before build', who:'Marketing', blocks:'Whether those two jobs exist'},\n      {field:'POS changes', col:'POSNotes', gate:'Before build', who:'Perrin + venue manager', blocks:'Perrin cannot action the till update'},\n      {field:'Google Ads eligible', col:'GoogleAdsEligible', gate:'Before build', who:'Marketing', blocks:'Paid search job and tracking setup'},\n      {field:'Landing or SEO page', col:'LandingPageURL', gate:'Before build', who:'Didier', blocks:'Paid media has nowhere to point'},\n      {field:'Web due date', col:'WebDuedate', gate:'Before build', who:'Marketing', blocks:'Web job has no deadline'},\n      {field:'Loop anyone else in', col:'AdditionalPeople', gate:'Before build', who:'Submitter', blocks:'People who should see the thread never get added'},\n      {field:'Final artwork', col:'ArtworkFile', gate:'Before go-live', who:'Luca or Didier', blocks:'Nothing can be printed or scheduled'},\n      {field:'Round number and notes', col:'DesignRound, DesignRoundNotes', gate:'Before go-live', who:'Marketing', blocks:'No reject path exists today', isNew:true},\n      {field:'Marketing sign-off', col:'ApprovalRequester', gate:'Before go-live', who:'Marketing', blocks:'Job cannot close', isNew:true},\n      {field:'Channel statuses', col:'DesignStatus, WebStatus, LoadedStatus, SocialStatus, PosStatus', gate:'Before go-live', who:'Each job owner', blocks:'Activity cannot be judged ready'},\n      {field:'Result and wrap note', col:'ActualAttendance, WrapNotes', gate:'At close', who:'Venue manager', blocks:'Activity closes with no learning attached', isNew:true},\n      {field:'Spend against budget', col:'Budget, ActualSpend', gate:'At close', who:'Marketing', blocks:'Next year is planned blind', isNew:true}\n    ];\n    const regGate = this.state.regGate;\n    const regChips = ['All','Submission','Triage','Before design','Before build','Before go-live','At close'].map(label => ({\n      label,\n      n: label === 'All' ? REGISTER.length : REGISTER.filter(r => r.gate === label).length,\n      pick: () => this.setState({regGate: label}),\n      css: `padding:5px 11px;border-radius:20px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:600;transition:.15s;`\n        + (regGate === label ? 'background:#0f120f;color:#fff;border:1px solid #0f120f' : 'background:#fff;color:#44443e;border:1px solid #e4e4de')\n    }));\n    const register = REGISTER.filter(r => regGate === 'All' || r.gate === regGate)\n      .map(r => ({...r, gateCss: PILL(GATE_TONE[r.gate][0], GATE_TONE[r.gate][1])}));\n\n    const folderRules = [\n      {name:'01 Brief', when:'Always. Holds the brief PDF and any reference the submitter attached.'},\n      {name:'02 Artwork working', when:'Any Artwork tick. Designer working files, never sent out.'},\n      {name:'03 Artwork final', when:'Any Artwork tick. Approved output only. This is what ArtworkFile points at.'},\n      {name:'04 Web', when:'Website promoted or Website artwork.'},\n      {name:'05 Social', when:'Meta promoted or Meta artwork.'},\n      {name:'06 Newsletter', when:'Newsletter promoted or Newsletter artwork.'},\n      {name:'07 Print and screens', when:'In-venue or TVs. Print-ready files at final size.'},\n      {name:'08 Paid', when:'Google Ads or Radio.'},\n      {name:'09 POS', when:'POS update required. Price sheets and till screenshots.'},\n      {name:'10 Tickets', when:'Ticketed event. Platform exports and the seating or capacity plan.'},\n      {name:'11 Loaded', when:'Loaded Rewards offer. App tile artwork and offer terms.'},\n      {name:'12 Supplier', when:'Supplier involved. Co-funding agreement and supplier-supplied assets.'}\n    ];\n    const folderSteps = [\n      {n:'On approval, not on submit', p:'The folder is created in the same atomic step that creates the jobs. A submission that gets rejected or merged never leaves an orphan folder on the drive, and by approval you know which subfolders are actually needed.'},\n      {n:'POST children, conflictBehavior fail', p:'One call per folder against the drive item, with conflictBehavior set to fail rather than rename. A duplicate must surface as an error, not silently become Grand Final Day 1.'},\n      {n:'Write the webUrl back', p:'The root folder webUrl from the response is written to JobFolderURL on the activity. Each job also stores the deep link to its own subfolder, so a designer lands in 03 Artwork final, not at the top.'},\n      {n:'Idempotent', p:'If JobFolderURL is already set, creation is skipped entirely. Re-approving or re-running the playbook must never duplicate the tree.'},\n      {n:'Folder failure does not block the activity', p:'If the drive call fails, the jobs still exist and the missing folder becomes an outstanding item against the activity. Losing a folder must not lose the work.'},\n      {n:'The Hub links out, it does not upload', p:'Every file lives in SharePoint and is put there in SharePoint. The Hub deep-links each job to its own subfolder and records which file is final, so there is one way in and no second copy to keep in step.'}\n    ];\n\n    const chaseRules = [\n      {when:'On submission', h:'Outstanding items are created, not flagged', p:'Each unanswered field that a later gate needs becomes a record against the activity with an owner, a gate and a due date derived from the start date.'},\n      {when:'Daily', h:'They appear in My Day', p:'The owner sees them in Needs you today, alongside their jobs. Not a red border on a form they closed a week ago.'},\n      {when:'Gate reached', h:'The gate names what is missing', p:'Luca and Didier are not notified until the brief is complete. The job sits at Brief needed and marketing is chased, not the designer.'},\n      {when:'Three days over', h:'It escalates once', p:'The marketing lead sees it in Operations Map under waiting on a decision. One escalation, not a daily email nobody reads.'}\n    ];\n\n    const CHAN_TONE = {Email:['#eaf0f8','#1a4fa0'], Inbox:['#e8f5ee','#0a6640'], 'My Day':['#f0eaf8','#6b3fa0'], Badge:['#f2f2ef','#44443e']};\n    const notifs = [\n      {trigger:'Activity submitted', who:'Marketing reviewer', chan:'Email', says:'Who submitted what, for which venue and when it starts. Link straight to Submissions.'},\n      {trigger:'Activity submitted', who:'Submitter', chan:'Inbox', says:'Confirmation with a thread to reply in. No email, they just pressed the button.'},\n      {trigger:'Triage finds gaps', who:'Submitter', chan:'Email', says:'The specific outstanding items, each with the gate it blocks and when it is needed. Not a generic please complete your submission.'},\n      {trigger:'Approved, jobs created', who:'Each job assignee', chan:'Email', says:'Their job only, with the brief, the due date and the parent activity. One email each, never a group send.'},\n      {trigger:'Approved, jobs created', who:'Submitter and venue', chan:'Inbox', says:'Accepted, here is what is being made and by when.'},\n      {trigger:'Design brief completed', who:'Designer', chan:'Email', says:'Brief is ready. This is the notification that does not exist today, so designers get briefs with blank copy fields.'},\n      {trigger:'Final file marked', who:'Marketing', chan:'Email', says:'Ready to review, with the round number and a direct link to the file.'},\n      {trigger:'Changes requested', who:'Designer', chan:'Email', says:'The round note verbatim, who wrote it, and the new round number.'},\n      {trigger:'Sign-off given', who:'Jobs waiting on artwork', chan:'My Day', says:'Artwork is approved and available. Web and paid can proceed.'},\n      {trigger:'Job overdue', who:'Job owner, then marketing lead', chan:'My Day', says:'Owner sees it the day it slips. Lead sees it after three days, once.'},\n      {trigger:'All jobs closed', who:'Marketing', chan:'My Day', says:'Nothing outstanding. The activity can go live.'},\n      {trigger:'Activity live', who:'Venue and submitter', chan:'Inbox', says:'Live, with the ticket link, the listing and where in-venue material has gone.'},\n      {trigger:'After the end date', who:'Venue manager', chan:'Email', says:'One request for the result and a wrap note. Asked once, not chased.'}\n    ].map(n => ({...n, chanCss: PILL(CHAN_TONE[n.chan][0], CHAN_TONE[n.chan][1])}));\n\n    const notifRules = [\n      {h:'Never a group send', p:'Each assignee gets their own job, not a digest of everyone else\\u2019s. Bulk import already gets this right by deliberately not sending eighty emails.'},\n      {h:'Silence is information', p:'Progress does not notify. Only a change of state, a blocker or a missed date does. If the Hub emails on everything, people stop reading it.'},\n      {h:'Email leaves the Hub, Inbox keeps it', p:'Email is for work someone must act on outside the Hub. Everything else stays as a thread, which is what the Activity Comments list is already for.'}\n    ];\n\n    const iaMoves = [\n      {h:'Four views collapse into Calendar', p:'Gantt, Cross-venue and Venue Monthly are lenses on the same dates. They become view chips, not destinations.'},\n      {h:'Dashboard and My Day were the same page', p:'Both answered \"what needs me today\". One screen, named for the question.'},\n      {h:'Submit becomes a persistent action', p:'It is the most common thing a venue manager does. It sits above the nav as a button, not inside a list of places.'},\n      {h:'Personal Tasks leaves the nav', p:'A private single-user list does not belong in shared navigation. It moves under the account menu.'}\n    ];\n\n    const flow = [\n      {n:'01', h:'Submit', p:'Venue answers the core questions. Ticketing, Loaded, POS and asset sections only appear if relevant.'},\n      {n:'02', h:'Triage', p:'Marketing corrects dates and mechanics, confirms what is really needed.'},\n      {n:'03', h:'Preview jobs', p:'Approve shows the jobs the answers imply. The approver switches off what is not needed with a recorded reason, and names an owner for everything that stays.', flag:'Designed'},\n      {n:'04', h:'Create atomically', p:'Jobs are created and linked, owners notified, then the activity advances. A failed write rolls everything back and keeps it in Intake. Re-entering a stage finds existing work instead of duplicating it.', flag:'Designed'},\n      {n:'05', h:'Produce', p:'Design, web, paid and ops work from their queues. Every ticket links back to the parent activity.'},\n      {n:'06', h:'Review', p:'Finished work attaches artwork or final URLs against the activity.'},\n      {n:'07', h:'Live', p:'Final approval publishes. Completion and post-campaign reporting close it out.'}\n    ].map((f, i, a) => ({...f, flag: f.flag || '', css: `flex:1;min-width:165px;padding:14px 15px;background:#fff;border:1px solid ${f.flag ? '#e8c8c2' : '#e4e4de'};${i === 0 ? 'border-radius:11px 0 0 11px;' : i === a.length - 1 ? 'border-radius:0 11px 11px 0;' : ''}${i > 0 ? 'border-left:none;' : ''}`}));\n\n    const entities = [\n      {name:'Activity', list:'Marketing & Activations 2026', desc:'The spine. An event, offer, promotion or recurring session at one venue.', rel:'→ has many Jobs, Comments, Assets', hero:true},\n      {name:'Job', list:'My Tasks', desc:'A unit of work: design, web, paid, ticketing, POS. Raised by playbook or by hand.', rel:'→ belongs to one Activity'},\n      {name:'Contact', list:'Customer CRM', desc:'One person across every venue and source, with consent history preserved.', rel:'→ many Venues, many Tickets'},\n      {name:'Venue', list:'Venues', desc:'Left Bank, Ravenswood, Whitfords, Hotel Darwin, Mustang Bar.', rel:'→ scopes Activities and Contacts'},\n      {name:'Ticket sale', list:'Eventbrite / Humanitix', desc:'External. Capacity and sales read back against the ticketed Activity.', rel:'→ one Activity, one Contact'},\n      {name:'Idea', list:'Idea Bank', desc:'Unscheduled concept. Promotes into an Activity when it gets a date.', rel:'→ becomes an Activity'},\n      {name:'Comment', list:'Comments', desc:'Threaded discussion, mentions drive the Inbox.', rel:'→ on an Activity or Job'}\n    ].map(e => ({...e, css: `background:#fff;border:1px solid ${e.hero ? '#0a6640' : '#e4e4de'};border-radius:11px;padding:14px 15px;${e.hero ? 'box-shadow:0 0 0 3px #e8f5ee;' : ''}`}));\n\n    // ── System page ──────────────────────────────────────────\n    const swatches = [\n      {name:'Canvas', hex:'#f7f7f5'}, {name:'Surface', hex:'#ffffff'}, {name:'Border', hex:'#e4e4de'},\n      {name:'Ink', hex:'#0f0f0d'}, {name:'Ink muted', hex:'#88887e'}, {name:'Accent', hex:'#0a6640'},\n      {name:'Gold', hex:'#b8860b'}, {name:'Red', hex:'#c0392b'}, {name:'Blue', hex:'#1a4fa0'},\n      {name:'Purple', hex:'#6b3fa0'}, {name:'Orange', hex:'#c05c1a'}, {name:'Sidebar', hex:'#0f120f'}\n    ].map(s => ({...s, chip: `height:52px;background:${s.hex};border-bottom:1px solid #e4e4de`}));\n\n    const pills = [\n      {label:'Live', c:['#e8f5ee','#0a6640']}, {label:'Triage', c:['#fdf6e3','#b8860b']},\n      {label:'Overdue', c:['#fdf0ee','#c0392b']}, {label:'Review', c:['#f4f0fd','#6b3fa0']},\n      {label:'Queued', c:['#f2f ed at settlement'}\n    ].filter(c => finShow(c.v));\n\n    const vSpent = k => txLensed.filter(t => t.v === k).reduce((a, t) => a + t.net, 0);\n    const vComm = k => FIN_COMMIT.filter(c => c.v === k).reduce((a, c) => a + c.amt, 0);\n    const finVenueRows = Object.keys(FIN_V).filter(finShow).map(k => {\n      const alloc = FIN_ALLOC[k], spent = vSpent(k), comm = vComm(k), left = alloc - spent - comm;\n      const pctS = Math.min(100, spent / alloc * 100), pctC = Math.min(100 - pctS, comm / alloc * 100);\n      return {\n        name: FIN_V[k].name, dot: DOT(FIN_V[k].c),\n        alloc: mny(alloc), spent: mny(spent), comm: comm ? mny(comm) : '—', left: mny(left),\n        leftCss: `font-family:'DM Mono',monospace;font-size:12px;font-weight:600;text-align:right;${left < 0 ? 'color:#c0392b' : 'color:#44443e'}`,\n        pct: Math.round((spent + comm) / alloc * 100) + '%',\n        spentBar: `height:100%;width:${pctS}%;background:#0a6640`,\n        commBar: `height:100%;width:${pctC}%;background:#0a664040`\n      };\n    });\n    const totAlloc = Object.keys(FIN_V).filter(finShow).reduce((a, k) => a + FIN_ALLOC[k], 0);\n    const totSpent = txLensed.reduce((a, t) => a + t.net, 0);\n    const totComm = FIN_COMMIT.reduce((a, c) => a + c.amt, 0);\n    const finStats = [\n      {l:'Allocated this month', n: mny(totAlloc), s:'Set per venue, top down'},\n      {l:'Committed', n: mny(totComm), s: FIN_COMMIT.length + ' orders placed, not yet billed'},\n      {l:'Spent', n: mny(totSpent), s: txLensed.length + ' card transactions, ex GST'},\n      {l:'Remaining', n: mny(totAlloc - totSpent - totComm), s:'After commitments clear'}\n    ].map((x, i) => ({...x, numCss: `font-family:'DM Mono',monospace;font-size:21px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px;color:${i === 3 ? '#0a6640' : '#0f0f0d'}`}));\n\n    // Derived spend, with an override. Marketing-only scope means some real costs\n    // never touch a card — an override keeps the number honest and says why.\n
