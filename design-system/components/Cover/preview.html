<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head><meta charset="utf-8">
<style>
  html, body { margin: 0; height: 300px; background: var(--surface); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 300px; }
  svg { position: absolute; left: 0; top: 0; }
  .slab { fill: var(--accent); } .coral { fill: var(--coral-500); } .green { fill: var(--green-700); } .mist { fill: var(--mist-500); }
  .cream { fill: var(--cream-500); } 
  .rule { fill: none; stroke: var(--on-accent); stroke-width: 2; }
  .frame { rx: var(--radius-frame); }
  .txt { position: absolute; left: 48px; bottom: 48px; max-width: 420px; }
  .name { margin: 0; font: 900 58px/0.95 var(--font-sans); text-transform: uppercase; color: var(--ink-brand); }
  .tag { margin: 12px 0 0; font: 500 14px/1.4 var(--font-sans); color: var(--ink-muted); }
</style></head>
<body>
<div class="cover">
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
  <!-- blocks: accent tall slab 224×300 (navy-900, gold-300 in the navy theme); green-700 112×144; coral-500 112×80; mist-500 112×76; cream-500 strip 224×64 -->
  <!-- arrangement: one tall navy slab at the right edge with satellites stacked to its left, the way the guide's colour pages stack bands -->
  <!-- pattern: the brand frame — a rounded on-accent outline (radius-frame) inside the navy slab with a gap cut into its top rule, from the guide's cover and divider pages -->
  <!-- steps: space-16 (64) and space-12 (48) multiples for sides; radius-frame (24) for the outline; radius-none blocks, square like the data -->
  <rect class="slab" x="736" y="0" width="224" height="300"/>
  <rect class="green" x="624" y="0" width="112" height="144"/>
  <rect class="coral" x="624" y="144" width="112" height="80"/>
  <rect class="mist" x="512" y="0" width="112" height="76"/>
  <rect class="cream" x="512" y="236" width="224" height="64"/>
  <rect class="rule frame" x="768" y="32" width="160" height="236" rx="24"/>
  <rect class="slab" x="808" y="28" width="80" height="8"/>
</svg>
<div class="txt">
  <h1 class="name">Marlin Hospitality</h1>
  <p class="tag">A modern hospitality group grounded in dependable experiences, meaningful connection, and lasting growth.</p>
</div>
</div>
</body>
</html>
